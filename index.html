<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aula Virtual - Herramientas Informáticas</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --ink: #1d2433;
      --muted: #6b7385; --accent: #2f5bea; --accent-d: #2447bd; --line: #e1e5ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      padding: 32px 16px; display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 900px; }
    header { margin-bottom: 28px; }
    h1 { font-size: 1.8rem; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0; font-size: 1rem; }
    
    h2.unit-title {
      font-size: 1.2rem; margin: 32px 0 16px; color: var(--accent-d);
      border-bottom: 2px solid var(--line); padding-bottom: 6px;
    }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    
    .session-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; box-shadow: 0 2px 8px rgba(20,30,60,.05);
      display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .session-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(20,30,60,.08); }
    
    .tag {
      align-self: flex-start; font-size: 0.75rem; background: #eef2ff;
      color: var(--accent-d); border-radius: 6px; padding: 3px 8px; font-weight: 700; margin-bottom: 12px;
    }
    .session-card h3 { font-size: 1.1rem; margin: 0 0 8px; }
    .session-card p { font-size: 0.88rem; color: var(--muted); margin: 0 0 16px; line-height: 1.4; }
    .btn {
      display: block; text-align: center; background: var(--accent); color: #fff;
      text-decoration: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--accent-d); }
    .empty-msg { color: var(--muted); font-size: 0.9rem; font-style: italic; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Herramientas Informáticas</h1>
      <p class="sub">Selecciona tu sesión o evaluación continua disponible para acceder a tu documento.</p>
    </header>

    <!-- UNIDAD 1 -->
    <h2 class="unit-title">Unidad 1</h2>
    <section class="grid" id="grid-u1">
      <p class="empty-msg">Cargando contenidos de la Unidad 1...</p>
    </section>

    <!-- UNIDAD 2 -->
    <h2 class="unit-title">Unidad 2</h2>
    <section class="grid" id="grid-u2">
      <p class="empty-msg">Cargando contenidos de la Unidad 2...</p>
    </section>
  </main>

  <!-- Cargamos el archivo independiente de clases -->
  <script src="clases.js"></script>
  <script>
    async function loadPortal() {
      const gridU1 = document.getElementById("grid-u1");
      const gridU2 = document.getElementById("grid-u2");

      const files = window.AULA_FILES || [];
      let itemsU1 = [];
      let itemsU2 = [];

      for (const file of files) {
        try {
          const response = await fetch(file);
          if (!response.ok) continue;

          const htmlText = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, "text/html");

          const tag = doc.querySelector('meta[name="session-tag"]')?.getAttribute("content") || "Contenido";
          const title = doc.querySelector('meta[name="session-title"]')?.getAttribute("content") || file;
          const desc = doc.querySelector('meta[name="session-desc"]')?.getAttribute("content") || "Acceso al documento interactivo.";

          const cardHTML = `
            <article class="session-card">
              <div>
                <span class="tag">${tag}</span>
                <h3>${title}</h3>
                <p>${desc}</p>
              </div>
              <a href="${file}" class="btn">Ingresar</a>
            </article>
          `;

          const lowerFile = file.toLowerCase();
          if (lowerFile.includes("u1")) {
            itemsU1.push(cardHTML);
          } else if (lowerFile.includes("u2")) {
            itemsU2.push(cardHTML);
          }
        } catch (err) {
          console.error("Error al procesar:", file);
        }
      }

      gridU1.innerHTML = itemsU1.length > 0 ? itemsU1.join("") : `<p class="empty-msg">No hay contenido disponible en la Unidad 1 por el momento.</p>`;
      gridU2.innerHTML = itemsU2.length > 0 ? itemsU2.join("") : `<p class="empty-msg">No hay contenido disponible en la Unidad 2 por el momento.</p>`;
    }

    loadPortal();
  </script>
</body>
</html>
