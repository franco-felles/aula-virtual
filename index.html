<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula Virtual · Herramientas Informáticas</title>
<!-- Sin sesión iniciada, esta página te manda a acceso.html -->
<script src="access/access.js" data-proteger data-sin-barra></script>
<link rel="icon" type="image/png" href="access/favicon.png">
<link rel="apple-touch-icon" href="access/icono.png">
<link rel="stylesheet" href="access/estilo.css">
<style>
  .hero { margin-bottom: 8px; }
  .unidad { margin-top: 38px; }
  .unidad-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 4px; }
  .unidad-h h2 { font-size: 1.35rem; letter-spacing: -.01em; margin: 0; }
  .unidad-h .linea { flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }
  .sub-h { font-family: var(--mono); font-size: .72rem; color: var(--mut); text-transform: uppercase; letter-spacing: .6px; margin: 20px 0 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  a.sesion {
    --acc: var(--moss); --acc-d: var(--moss-d); --acc-bg: var(--moss-bg);
    position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 22px;
    text-decoration: none; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    overflow: hidden; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  a.sesion.ec { --acc: var(--amber); --acc-d: var(--amber-d); --acc-bg: var(--amber-bg); }
  a.sesion::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--acc); }
  a.sesion:hover { transform: translateY(-3px); border-color: var(--acc); box-shadow: 0 12px 28px rgba(16, 35, 28, .10); }
  a.sesion:focus-visible { outline: 3px solid rgba(53, 81, 63, .3); outline-offset: 2px; }
  .s-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .s-tipo { font-family: var(--mono); font-size: .68rem; font-weight: 600; letter-spacing: .6px; color: var(--acc-d); background: var(--acc-bg); border-radius: 6px; padding: 3px 8px; }
  .s-id { font-family: var(--mono); font-size: .7rem; color: var(--mut); }
  .s-num { font-family: var(--mono); font-size: 2.4rem; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
  .s-num small { display: block; font-family: var(--sans); font-size: .85rem; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-top: 6px; }
  .s-go { display: flex; align-items: center; justify-content: space-between; font-size: .85rem; font-weight: 600; color: var(--acc-d); }
  .s-go svg { width: 18px; height: 18px; transition: transform .18s; }
  a.sesion:hover .s-go svg { transform: translateX(4px); }

  a.sesion.off { cursor: not-allowed; background: transparent; border-style: dashed; }
  a.sesion.off:hover { transform: none; box-shadow: none; border-color: var(--line); }
  a.sesion.off::before { background: var(--line); }
  a.sesion.off .s-num, a.sesion.off .s-tipo { opacity: .55; }
  a.sesion.off .s-go { color: var(--mut); font-weight: 500; }
  a.sesion.abierta .s-go { color: var(--moss); }
  .skeleton { height: 150px; border-radius: 14px; background: linear-gradient(100deg, #ece8dc 30%, #f6f4ee 50%, #ece8dc 70%); background-size: 200% 100%; animation: brillo 1.2s linear infinite; }
  @keyframes brillo { to { background-position: -200% 0; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="plate">
        <span class="plate-mark"><img src="access/icono.png" alt=""></span>
        <span class="plate-txt"><b>Aula Virtual</b><small>Herramientas Informáticas</small></span>
      </div>
      <div class="who-chip">
        <i class="dot"></i><span id="quien"></span>
        <button class="btn ghost sm" id="salir" type="button">Salir</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero anim">
      <p class="eyebrow" id="saludoRol">Portal</p>
      <h1 class="titulo" id="saludo">Hola</h1>
      <p class="lede" id="lede">Elige tu clase o evaluación para ir directo a tu documento.</p>
    </section>
    <div id="contenido"><div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    /* ==========================================================
       PORTAL: crea un botón por cada sesión que exista. No hay lista que mantener.

       Para publicar algo nuevo solo sube el CSV con el nombre correcto:
         clases/class#u#.csv     -> clase # de la unidad #     (class4u1.csv, class2u2.csv ...)
         eecc/ec#u#.csv          -> evaluación continua        (ec1u1.csv, ec2u1.csv ...)
       El botón aparece solo. Al presionarlo:
         alumno  -> su documento se abre en una PESTAÑA NUEVA (el portal sigue abierto)
                    y aparece una notificación en pantalla
         docente -> abre access/sesion.html?s=<sesión> con la lista de alumnos y enlaces
       (clases/class1u1.html es la única clase que es una página: no lleva CSV.)

       Búsqueda automática: por cada unidad y tipo se prueban los números 1, 2, 3...
       y se detiene tras HUECOS números seguidos que no existen.
       ========================================================== */
    const UNIDADES = [1, 2, 3, 4];   // cuántas unidades se buscan
    const HUECOS = 3;                // se tolera faltar hasta 3 números seguidos (class5 sin class6, class7 y class8 => fin)
    const TOPE = 40;                 // límite de seguridad por unidad y tipo

    const ICONO_FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    async function existe(info) {
      const [csv, html] = await Promise.all([
        Acceso.textoCSV(info.carpeta + info.id + ".csv"),
        info.tipo === "class" ? Acceso.existeHTML(info.id) : false
      ]);
      if (!csv && !html) return null;
      info.csv = csv; info.html = !!html;       // se guarda el CSV para saber cuál es el enlace de este alumno
      return info;
    }

    async function sondear(tipo, unidad) {
      const halladas = [];
      let falta = 0;
      for (let n = 1; n <= TOPE && falta < HUECOS; n++) {
        const info = Acceso.idSesion(`${tipo}${n}u${unidad}`);
        const hallada = await existe(info);
        if (hallada) { halladas.push(hallada); falta = 0; } else falta++;
      }
      return halladas;
    }

    async function detectar() {
      const tareas = [];
      for (const u of UNIDADES) for (const tipo of ["class", "ec"]) tareas.push(sondear(tipo, u));
      return (await Promise.all(tareas)).flat();
    }

    /* Para el alumno: busca SU enlace en el CSV de la sesión. Define info.href y info.estado */
    function resolver(info, s) {
      info.estado = "ok";
      if (s.rol === "docente") { info.href = "access/sesion.html?s=" + encodeURIComponent(info.id); info.interno = true; return; }
      if (!info.csv) {                                            // clase de contenido (class1u1.html)
        if (info.html) { info.href = `clases/${info.id}.html`; info.interno = true; info.nueva = true; } else info.estado = "nd";
        return;
      }
      const t = Acceso.leerTabla(info.csv);
      if (t.titulo && Acceso.norm(t.titulo) !== info.id) { info.estado = "titulo"; return; }
      const fila = Acceso.buscarFila(t.filas, s.codigo);
      if (!fila) info.estado = "no-registrado";
      else if (!/^https?:\/\//i.test(fila.link)) info.estado = "sin-enlace";
      else info.href = fila.link;
    }
    const TEXTO_ESTADO = {
      "sin-enlace": "Aún no disponible",
      "no-registrado": "No figuras aquí",
      "titulo": "Archivo con error",
      "nd": "Aún no disponible"
    };

    function toast(titulo, texto, tipo) {
      const t = el("div", "toast" + (tipo ? " " + tipo : ""));
      const ico = el("span", "t-ico");
      ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
      const cuerpo = el("div"); cuerpo.append(el("b", "", titulo), el("p", "", texto));
      const x = el("button", "t-x", "×"); x.type = "button"; x.setAttribute("aria-label", "Cerrar");
      const quitar = () => { t.classList.add("sale"); setTimeout(() => t.remove(), 300); };
      x.onclick = quitar;
      t.append(ico, cuerpo, x);
      const caja = document.getElementById("toasts");
      while (caja.children.length >= 3) caja.firstChild.remove();
      caja.appendChild(t);
      setTimeout(quitar, 6000);
    }

    function tarjeta(info) {
      const off = info.estado !== "ok";
      const a = el("a", "sesion" + (info.tipo === "ec" ? " ec" : "") + (off ? " off" : ""));
      const top = el("div", "s-top");
      top.append(el("span", "s-tipo", info.tipo === "ec" ? "EVALUACIÓN" : "CLASE"), el("span", "s-id", info.id));
      const num = el("div", "s-num", String(info.num).padStart(2, "0"));
      num.appendChild(el("small", "", info.nombre));
      const go = el("div", "s-go");
      const lbl = el("span", "", off ? TEXTO_ESTADO[info.estado] : (info.nueva ? "Abrir clase" : info.interno ? "Ingresar" : "Abrir mi documento"));
      go.append(lbl);
      if (!off) go.insertAdjacentHTML("beforeend", ICONO_FLECHA);
      a.append(top, num, go);
      if (off) { a.setAttribute("aria-disabled", "true"); a.addEventListener("click", e => e.preventDefault()); return a; }
      a.href = info.href;
      if (!info.interno || info.nueva) {
        // alumno: pestaña nueva; el portal queda abierto + notificación.
        // Los enlaces externos llevan noopener; la página interna (class1u1) no, para que herede la sesión.
        a.target = "_blank"; if (!info.interno) a.rel = "noopener noreferrer";
        a.addEventListener("click", e => {
          // window.open (sin noopener) hace que la pestaña nueva herede la sesión; <a target=_blank> no
          if (info.nueva) { e.preventDefault(); window.open(info.href, "_blank"); }
          a.classList.add("abierta");
          lbl.textContent = "Abierto · volver a abrir";
          toast(info.nueva ? "Abriendo la clase" : "Abriendo tu documento", `${info.etiqueta} se abre en una pestaña nueva. Esta página sigue aquí por si quieres abrir otra.`);
        });
      }
      return a;
    }

    function seccion(titulo, lista) {
      const frag = document.createDocumentFragment();
      if (!lista.length) return frag;
      frag.appendChild(el("div", "sub-h", titulo));
      const grid = el("div", "grid");
      lista.forEach(s => grid.appendChild(tarjeta(s)));
      frag.appendChild(grid);
      return frag;
    }

    async function cargarPortal() {
      const s = (await Acceso.listo) && Acceso.sesion();
      const docente = s.rol === "docente";
      document.getElementById("quien").textContent = s.nombre;
      document.getElementById("salir").onclick = Acceso.salir;
      document.getElementById("saludoRol").textContent = docente ? "Modo docente" : (s.grupo ? "Grupo " + s.grupo : "Portal");
      document.getElementById("saludo").textContent = docente
        ? "Hola, " + s.nombre.split(/\s+/)[0]
        : "Tus clases y evaluaciones";
      document.getElementById("lede").textContent = docente
        ? "Elige una clase o evaluación para ver a tus alumnos y sus enlaces."
        : "Elige tu clase o evaluación: tu documento se abre en una pestaña nueva y este portal sigue aquí.";

      const cont = document.getElementById("contenido");
      const sesiones = await detectar();
      sesiones.forEach(x => resolver(x, s));
      cont.replaceChildren();
      const ordenadas = sesiones.sort((a, b) => a.unidad - b.unidad || a.num - b.num);
      const unidades = [...new Set(ordenadas.map(x => x.unidad))];
      if (!unidades.length) { cont.appendChild(el("p", "vacio", "Aún no hay clases ni evaluaciones disponibles.")); return; }
      for (const u of unidades) {
        const bloque = el("section", "unidad anim");
        const h = el("div", "unidad-h"); h.append(el("h2", "", "Unidad " + u), el("span", "linea"));
        bloque.appendChild(h);
        bloque.appendChild(seccion("Clases", ordenadas.filter(x => x.unidad === u && x.tipo === "class")));
        bloque.appendChild(seccion("Evaluaciones continuas", ordenadas.filter(x => x.unidad === u && x.tipo === "ec")));
        cont.appendChild(bloque);
      }
    }
    cargarPortal();
  </script>
</body>
</html>
