<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi documento</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#6b7385;--accent:#2f5bea;--accent-d:#2447bd;--line:#e1e5ee;--err:#c62828;--ok:#1b7f3b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:560px}
  h1{font-size:1.5rem;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(20,30,60,.05)}
  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  input{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  
  /* Contenedor para el input de contraseña y el botón de ver/ocultar */
  .password-container {
    position: relative;
    display: flex;
    align-items: center;
  }
  .password-container input {
    padding-right: 48px;
  }
  .toggle-password {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--muted);
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-password:hover {
    color: var(--ink);
  }

  button{font:inherit;cursor:pointer}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%;margin-top:12px}
  .btn:hover{background:var(--accent-d)}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.link{display:block;text-align:center;text-decoration:none}
  .ghost{background:none;border:0;color:var(--accent);padding:0;font-size:.9rem;margin-top:14px}
  ul.results{list-style:none;margin:12px 0 0;padding:0;max-height:340px;overflow:auto}
  ul.results li{border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  ul.results button{width:100%;text-align:left;background:#fff;border:0;border-radius:10px;padding:11px 14px;color:var(--ink)}
  ul.results button:hover{background:#eef2ff}
  .tag{display:inline-block;font-size:.75rem;background:#eef2ff;color:var(--accent-d);border-radius:6px;padding:2px 7px;margin-left:6px;font-weight:600}
  .empty,.hint{color:var(--muted);font-size:.9rem;margin-top:12px}
  .name{font-weight:700;font-size:1.05rem}
  .err{color:var(--err);font-size:.9rem;margin-top:10px;min-height:1.2em}
  .ok{color:var(--ok);font-weight:600;margin:0 0 4px}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Busca tu documento</h1>
  <p class="sub">Escribe tu nombre o apellido, elígete en la lista y desbloquea tu documento con tu código de alumno.</p>

  <section class="card" id="step1">
    <label for="q">Tu nombre</label>
    <input id="q" type="search" placeholder="Ej.: Quispe, Juan Carlos…" autocomplete="off" autofocus>
    <ul class="results" id="results"></ul>
    <div class="hint" id="hint">Escribe al menos 2 letras.</div>
  </section>

  <section class="card hidden" id="step2">
    <div class="name" id="who"></div>
    <div class="sub" id="meta" style="margin:2px 0 14px"></div>
    <form id="form" autocomplete="off">
      <label for="code">Código de alumno (contraseña)</label>
      <div class="password-container">
        <input id="code" type="password" placeholder="Ej.: 2026D0000" autocapitalize="characters" spellcheck="false" required>
        <button type="button" class="toggle-password" id="toggleCode" title="Ver/Ocultar código">👁️</button>
      </div>
      <button class="btn" id="go" type="submit">Desbloquear documento</button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <button class="ghost" id="back" type="button">← Buscar otro nombre</button>
  </section>

  <section class="card hidden" id="step3">
    <p class="ok">✔ Documento desbloqueado</p>
    <div class="name" id="who2"></div>
    <a class="btn link" id="open" target="_blank" rel="noopener noreferrer">Abrir mi documento</a>
    <button class="ghost" id="again" type="button">← Volver al inicio</button>
  </section>
</main>

const ITER = 100000;

const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
DATA.forEach(d => d.k = norm(d.a));

let current = null;

function search() {
  const terms = norm($("q").value).split(/\s+/).filter(Boolean);
  const ul = $("results");
  ul.innerHTML = "";
  if (norm($("q").value).length < 2) { $("hint").textContent = "Escribe al menos 2 letras."; return; }
  const found = DATA.filter(d => terms.every(t => d.k.includes(t))).slice(0, 30);
  $("hint").textContent = found.length ? "" : "No se encontró ningún alumno con ese nombre.";
  for (const d of found) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = d.a;
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = d.g;
    b.appendChild(t);
    b.onclick = () => pick(d);
    li.appendChild(b);
    ul.appendChild(li);
  }
}

function show(id) {
  ["step1", "step2", "step3"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}

function pick(d) {
  current = d;
  $("who").textContent = d.a;
  $("meta").textContent = "Grupo " + d.g + " · N.º " + d.n;
  $("code").value = "";
  $("err").textContent = "";
  show("step2");
  $("code").focus();
}

async function unlock(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(current.s), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(current.i) }, key, b64(current.c));
  return new TextDecoder().decode(pt);
}

$("q").addEventListener("input", search);

// Lógica para alternar la visibilidad de la contraseña
$("toggleCode").addEventListener("click", () => {
  const codeInput = $("code");
  if (codeInput.type === "password") {
    codeInput.type = "text";
    $("toggleCode").textContent = "🙈";
  } else {
    codeInput.type = "password";
    $("toggleCode").textContent = "👁️";
  }
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("code").value.trim().toUpperCase();
  if (!code) return;
  $("go").disabled = true;
  $("err").textContent = "";
  try {
    const url = await unlock(code);
    $("who2").textContent = current.a;
    $("open").href = url;
    show("step3");
  } catch (_) {
    $("err").textContent = "Código incorrecto. Revisa tu código de alumno e inténtalo de nuevo.";
    $("code").select();
  } finally {
    $("go").disabled = false;
  }
});
$("back").onclick = () => { current = null; show("step1"); $("q").focus(); };
$("again").onclick = () => {
  current = null; $("open").removeAttribute("href"); $("q").value = ""; $("results").innerHTML = "";
  $("hint").textContent = "Escribe al menos 2 letras."; show("step1"); $("q").focus();
};
</script>
