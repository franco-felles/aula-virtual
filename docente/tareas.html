<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entregas en PDF · Aula Virtual</title>
<!-- Solo docente. Crear, editar, ocultar/abrir/cerrar y eliminar tareas de entrega en PDF (pestaña "Tareas" del Panel).
     Cada tarea aparece dentro de su clase o EC; el alumno sube su PDF en eecc/tarea.html?id=… y ahí mismo se califica. -->
<script src="../conexion/aula.js" data-docente data-sin-barra></script>
<link rel="icon" type="image/png" href="../conexion/img/favicon.png">
<link rel="stylesheet" href="../conexion/estilo.css">
<style>
  body { --acc: var(--amber); --acc-d: var(--amber-d); --acc-bg: var(--amber-bg); }
  .btn.lg { padding: 14px 22px; font-size: 1rem; border-radius: 12px; }
  .btn.acc { background: var(--acc); border-color: var(--acc); }
  .btn.acc:hover { background: var(--acc-d); border-color: var(--acc-d); }
  .btn.peligro { background: var(--panel); color: var(--err); border-color: #efc3bf; }
  .btn.peligro:hover { background: var(--err); color: #fff; border-color: var(--err); }
  .cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .seccion { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 12px; font-size: 1.05rem; }
  .seccion small { font-family: var(--mono); font-size: .75rem; color: var(--mut); font-weight: 500; }
  .seccion::after { content: ""; flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }
  .tp { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--acc); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 12px 18px; align-items: center; }
  .tp.es-oculto { border-left-style: dashed; background: #fbfaf6; }
  .tp .info { min-width: 0; }
  .tp .tit { display: block; font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: .7rem; font-weight: 600; border-radius: 6px; padding: 3px 8px; background: var(--paper); border: 1px solid var(--line); color: var(--ink-2); }
  .chip.dest { background: var(--acc-bg); border-color: transparent; color: var(--acc-d); }
  .chip.warn { background: var(--err-bg); border-color: #efc3bf; color: var(--err); }
  .tp .acciones { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; }
  .tp .acciones .sep { flex: 1; }
  @media (max-width: 640px) { .tp { grid-template-columns: 1fr; } }
  .seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: .82rem; font-weight: 600; padding: 8px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .seg button:hover { background: #ebe7da; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .seg button.on.abierto { background: var(--moss); }
  .seg button.on.oculto { background: var(--mut); }
  .seg button.on.devuelto { background: var(--acc); }
  .seg.grande button { padding: 11px 18px; font-size: .92rem; }
  .seg:has(button:disabled) { opacity: .6; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card > h2 { font-size: .78rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .6px; color: var(--mut); margin: 0 0 14px; font-weight: 600; }
  .campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .campo > span { font-family: var(--mono); font-size: .72rem; color: var(--mut); }
  .campo input, .campo select, .campo textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; }
  .campo textarea { min-height: 110px; resize: vertical; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(179,117,44,.15); }
  .campo small { color: var(--mut); font-size: .8rem; }
  .campo small.warn { color: var(--err); }
  .opc { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  .opc .txt { flex: 1; }
  .opc b { display: block; font-size: .95rem; }
  .opc small { color: var(--mut); font-size: .8rem; }
  .sw { width: 46px; height: 26px; appearance: none; background: var(--line); border-radius: 999px; position: relative; cursor: pointer; transition: background .15s; margin: 0; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .sw:checked { background: var(--moss); }
  .sw:checked::after { left: 23px; }
  .estado-fila { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .estado-fila small { color: var(--mut); font-size: .84rem; }
  .barra-guardar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  .panel-viejo { background: var(--err-bg); border: 1px solid #efc3bf; color: var(--err); border-radius: 12px; padding: 12px 16px; margin: 16px 0; font-size: .88rem; }
  dialog.conf { border: 0; border-radius: 16px; padding: 24px; max-width: 440px; width: calc(100vw - 32px); box-shadow: 0 24px 60px rgba(16,35,28,.3); background: var(--panel); color: var(--ink); }
  dialog.conf::backdrop { background: rgba(16,35,28,.45); }
  dialog.conf h3 { margin: 0 0 8px; font-size: 1.15rem; }
  dialog.conf p { margin: 0 0 12px; color: var(--ink-2); font-size: .92rem; }
  dialog.conf label { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; margin: 6px 0 14px; cursor: pointer; }
  dialog.conf label input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--err); }
  dialog.conf .bts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
  <header class="topbar"><div class="topbar-in">
    <a class="plate" href="../index.html"><span class="plate-mark"><img src="../conexion/img/icono.png" alt=""></span>
      <span class="plate-txt"><b>Aula Virtual</b><small>Herramientas Informáticas</small></span></a>
    <div class="who-chip"><i class="dot"></i><span id="quien"></span><button class="btn ghost sm" id="salir" type="button">Salir</button></div>
  </div></header>
  <main class="wrap" id="app"><p class="vacio">Cargando…</p></main>

<script>
const { el } = Aula;
const app = document.getElementById("app");
const boton = (texto, cls) => { const b = el("button", "btn " + (cls || ""), texto); b.type = "button"; return b; };
const olvidar = () => Aula.olvidar("tareaLista", "portal", "clase");
let clases = [];
const PANEL_VIEJO = "El Panel todavía no tiene las entregas en PDF. En Apps Script pega el api.gs nuevo (y el panel.gs) y luego Implementar → Gestionar implementaciones → ✏ → Versión: Nueva versión → Implementar. La primera vez que crees una tarea se agregan solas las pestañas «Tareas» y «EnviosPDF».";
const textoError = ex => /Acción desconocida/.test(ex.message) ? PANEL_VIEJO : ex.message;

const ESTADOS = [
  ["oculto", "Oculta", "Los alumnos no la ven."],
  ["abierto", "Abierta", "Pueden subir su PDF (o cambiarlo mientras no lo califiques)."],
  ["cerrado", "Cerrada", "La ven, pero ya no pueden subir."],
  ["devuelto", "Devuelta", "Cerrada. Cada alumno ve su nota y descarga su evaluación corregida."]
];
const estadoDe = t => t.oculto ? "oculto" : t.abierto ? "abierto" : t.devuelto ? "devuelto" : "cerrado";
const opcionesEstado = k => ({ oculto: k === "oculto", abierto: k === "abierto", devuelto: k === "devuelto" });
const textoVer = t => t.devuelto ? "devuelta: descargan su evaluación" : t.verNota ? "ven su nota al guardarla" : "ven su nota al devolverla";
const PANEL_SIN_DEVOLVER = "Para devolver evaluaciones, el Panel necesita el api.gs nuevo: pégalo en Apps Script y luego Implementar → Gestionar implementaciones → ✏ → Versión: Nueva versión → Implementar.";
function segEstado(valor, alCambiar, grande) {
  const seg = el("div", "seg" + (grande ? " grande" : ""));
  ESTADOS.forEach(([k, txt, tip]) => {
    const b = el("button", k + (k === valor ? " on" : ""), txt); b.type = "button"; b.title = tip;
    b.onclick = async () => {
      if (b.classList.contains("on")) return;
      const antes = seg.querySelector(".on");
      seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      seg.valor = k;
      if (alCambiar && await alCambiar(k) === false) { seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === antes)); seg.valor = valor; }
    };
    seg.appendChild(b);
  });
  seg.valor = valor;
  seg.bloquear = v => seg.querySelectorAll("button").forEach(x => x.disabled = v);
  return seg;
}
function destino(id) {
  const cl = clases.find(c => c.id === id);
  if (!cl) return { texto: id ? id.toUpperCase() : "Sin carpeta", aviso: "Esa carpeta no existe en el Panel" };
  return { texto: (cl.tipo === "EC" ? `EC${cl.n} · U${cl.unidad}` : `U${cl.unidad} · Clase ${cl.n}`) + (cl.tema ? " — " + cl.tema : ""),
           aviso: cl.publicada ? "" : "La carpeta no está publicada: los alumnos no la ven" };
}
function confirmar({ titulo, texto, ok, casilla }) {
  return new Promise(res => {
    const d = el("dialog", "conf");
    d.append(el("h3", "", titulo)); if (texto) d.append(el("p", "", texto));
    let chk = null;
    if (casilla) { const l = el("label"); chk = el("input"); chk.type = "checkbox"; l.append(chk, casilla); d.append(l); }
    const bts = el("div", "bts"), no = boton("Cancelar", "ghost lg"), si = boton(ok, "peligro lg");
    si.style.cssText = "background:var(--err);color:#fff;border-color:var(--err)";
    bts.append(no, si); d.append(bts);
    const fin = v => { d.close(); d.remove(); res(v); };
    no.onclick = () => fin(null); si.onclick = () => fin({ marcado: chk ? chk.checked : false });
    d.addEventListener("cancel", e => { e.preventDefault(); fin(null); });
    document.body.appendChild(d); d.showModal(); no.focus();
  });
}

/* ======================= LISTA ======================= */
async function vistaLista() {
  history.replaceState(null, "", location.pathname);
  app.replaceChildren(el("p", "vacio", "Cargando…"));
  try { await Aula.apiRapida("tareaLista", {}, pintarLista); }
  catch (ex) { app.replaceChildren(el("div", "panel-viejo", textoError(ex))); }
}

function pintarLista(r) {
  if (/editar=|nueva/.test(location.search)) return;
  clases = r.clases;
  const volver = el("a", "btn ghost", "← Inicio"); volver.href = Aula.url("index.html"); volver.style.marginBottom = "18px";
  const cab = el("div", "cab"), izq = el("div");
  izq.append(el("p", "eyebrow", "Docente"), el("h1", "titulo", "Entregas en PDF"),
    el("p", "lede", "El alumno sube su trabajo en PDF sin necesitar cuenta de Google. Tú lo abres aquí, lo corriges encima, le pones el sello con la nota (0–20) y descargas las notas en Excel. Cuando termines de calificar, pásala a «Devuelta»: se cierra y cada alumno descarga su evaluación corregida."));
  const nuevo = boton("+ Nueva entrega", "acc lg"); nuevo.onclick = () => vistaEditor(null);
  cab.append(izq, nuevo);
  app.replaceChildren(volver, cab);
  if (!r.tareas.length) { app.appendChild(el("p", "vacio", "Aún no tienes entregas en PDF. Crea la primera.")); return; }
  const porClase = {};
  r.tareas.forEach(t => (porClase[t.clase] = porClase[t.clase] || []).push(t));
  Object.keys(porClase).sort((a, b) => a.localeCompare(b, "es", { numeric: true })).forEach(c => {
    const h = el("h2", "seccion", destino(c).texto); h.append(" ", el("small", "", String(porClase[c].length))); app.appendChild(h);
    porClase[c].sort((a, b) => a.titulo.localeCompare(b.titulo)).forEach(t => app.appendChild(filaTarea(t)));
  });
}

function filaTarea(t) {
  const d = destino(t.clase);
  const fila = el("div", "tp" + (t.oculto ? " es-oculto" : ""));
  const info = el("div", "info"), chips = el("div", "chips");
  chips.append(el("span", "chip dest", d.texto), el("span", "chip", `${t.entregaron} entregaron · ${t.calificados} calificados`),
    el("span", "chip ver", textoVer(t)));
  if (d.aviso && !t.oculto) chips.append(el("span", "chip warn", "⚠ " + d.aviso));
  info.append(el("span", "tit", t.titulo), chips);
  const seg = segEstado(estadoDe(t), async k => {
    if (k === "devuelto" && t.entregaron > t.calificados) {
      const falta = t.entregaron - t.calificados;
      const ok = await confirmar({ titulo: `Faltan ${falta} sin nota`, ok: "Devolver igual",
        texto: `${falta} alumno(s) entregaron y aún no tienen nota: descargarán su PDF tal como lo subieron. Puedes seguir calificando después; lo verán al volver a entrar.` });
      if (!ok) return false;
    }
    seg.bloquear(true);
    try {
      const r = await Aula.api("tareaOpciones", { id: t.id, opciones: opcionesEstado(k) });
      Object.assign(t, r.tarea);
      if (k === "devuelto" && !t.devuelto) { Aula.toast("Falta actualizar el Panel", PANEL_SIN_DEVOLVER, "warn"); return false; }
      fila.classList.toggle("es-oculto", t.oculto); olvidar();
      fila.querySelector(".chip.ver").textContent = textoVer(t);
      const e = ESTADOS.find(x => x[0] === k); Aula.toast(e[1], e[2]);
      return true;
    } catch (ex) { Aula.toast("No se pudo cambiar", textoError(ex), "warn"); return false; }
    finally { seg.bloquear(false); }
  });
  const acc = el("div", "acciones");
  const ver = el("a", "btn acc", "Ver entregas y calificar"); ver.href = Aula.url("eecc/tarea.html?id=" + t.id);
  const ed = boton("Editar", "ghost"); ed.onclick = () => vistaEditor(t);
  const bo = boton("Eliminar", "peligro");
  bo.onclick = async () => {
    const r = await confirmar({ titulo: `¿Eliminar «${t.titulo}»?`, ok: "Eliminar",
      texto: "La tarea deja de aparecer. Los PDF de los alumnos se quedan en tu Drive (carpeta ENTREGAS PDF de la clase).",
      casilla: t.entregaron ? `Borrar también las ${t.entregaron} entrega(s) y notas de la pestaña EnviosPDF.` : null });
    if (!r) return;
    try { await Aula.api("tareaBorrar", { id: t.id, conEnvios: r.marcado }); olvidar(); Aula.toast("Entrega eliminada", t.titulo); vistaLista(); }
    catch (ex) { Aula.toast("No se pudo eliminar", textoError(ex), "warn"); }
  };
  acc.append(ver, ed, el("span", "sep"), bo);
  fila.append(info, seg, acc);
  return fila;
}

/* ======================= EDITOR ======================= */
async function vistaEditor(t) {
  history.replaceState(null, "", location.pathname + (t ? "?editar=" + t.id : "?nueva"));
  if (!clases.length) {
    app.replaceChildren(el("p", "vacio", "Cargando…"));
    try { const r = await Aula.api("tareaLista"); clases = r.clases; if (t && !t.titulo) t = r.tareas.find(x => x.id === t.id) || null; }
    catch (ex) { app.replaceChildren(el("div", "panel-viejo", textoError(ex))); return; }
  }
  const nueva = !t;
  t = t || { titulo: "", clase: "", indicaciones: "", verNota: false, oculto: true, abierto: false, devuelto: false };
  const volver = boton("← Volver a la lista", "ghost"); volver.style.marginBottom = "18px"; volver.onclick = vistaLista;
  const h = el("h1", "titulo", nueva ? "Nueva entrega en PDF" : "Editar entrega");

  const card = el("div", "card"); card.append(el("h2", "", "Datos"));
  const cTit = el("label", "campo"), iTit = el("input"); iTit.value = t.titulo; iTit.maxLength = 120; iTit.placeholder = "Ej.: EC final de la Unidad 1";
  cTit.append(el("span", "", "Título (lo ven los alumnos)"), iTit);
  const cCla = el("label", "campo"), sCla = el("select"), aviso = el("small");
  sCla.append(new Option("Elige la clase o EC…", ""));
  const orden = c => Number(c.unidad) * 100 + (c.tipo === "EC" ? c.n * 3 + .5 : Number(c.n));
  clases.slice().sort((a, b) => orden(a) - orden(b)).forEach(c => sCla.append(new Option(destino(c.id).texto + (c.publicada ? "" : "  (no publicada)"), c.id)));
  sCla.value = t.clase || "";
  const avisar = () => { const d = sCla.value ? destino(sCla.value) : null; aviso.textContent = d && d.aviso ? "⚠ " + d.aviso : "Aparece dentro de esa carpeta, en «Entregas en PDF»."; aviso.className = d && d.aviso ? "warn" : ""; };
  sCla.onchange = avisar; avisar();
  cCla.append(el("span", "", "¿Dónde aparece?"), sCla, aviso);
  const cInd = el("label", "campo"), iInd = el("textarea"); iInd.value = t.indicaciones; iInd.maxLength = 2000;
  iInd.placeholder = "Ej.: Descarga tu EC como PDF (Archivo → Descargar → Documento PDF) y súbelo aquí antes de salir del laboratorio.";
  cInd.append(el("span", "", "Indicaciones (opcional)"), iInd);
  const opc = el("label", "opc"), sw = el("input", "sw"); sw.type = "checkbox"; sw.checked = t.verNota !== false;
  const tx = el("span", "txt"); tx.append(el("b", "", "Ven su nota apenas la guardes"), el("small", "", "Apagado: la ven recién cuando pases la entrega a «Devuelta», todos a la vez (ahí también descargan su PDF corregido)."));
  opc.append(tx, sw);
  card.append(cTit, cCla, cInd, opc);

  const cardE = el("div", "card"); cardE.append(el("h2", "", "Estado"));
  const seg = segEstado(estadoDe(t), null, true);
  const fe = el("div", "estado-fila"); fe.append(seg, el("small", "", "Oculta: no la ven · Abierta: pueden subir · Cerrada: ya no suben · Devuelta: cerrada y cada alumno descarga su evaluación con la nota."));
  cardE.append(fe);

  const barra = el("div", "barra-guardar");
  const guardar = boton(nueva ? "Crear entrega" : "Guardar cambios", "acc lg"), cancelar = boton("Cancelar", "ghost lg");
  cancelar.onclick = vistaLista;
  guardar.onclick = async () => {
    if (!iTit.value.trim()) { iTit.focus(); return Aula.toast("Falta el título", "", "warn"); }
    if (!sCla.value) { sCla.focus(); return Aula.toast("Elige la clase o EC", "Es donde los alumnos verán la entrega.", "warn"); }
    guardar.disabled = true;
    try {
      const r = await Aula.api("tareaGuardar", { tarea: { id: t.id, titulo: iTit.value, clase: sCla.value, indicaciones: iInd.value,
        verNota: sw.checked, ...opcionesEstado(seg.valor) } });
      olvidar(); Aula.toast(nueva ? "Entrega creada" : "Cambios guardados", seg.valor === "oculto" ? "Está oculta: ábrela cuando quieras que suban su PDF." : "");
      if (nueva) location.href = Aula.url("eecc/tarea.html?id=" + r.id); else vistaLista();
    } catch (ex) { Aula.toast("No se guardó", textoError(ex), "warn"); guardar.disabled = false; }
  };
  barra.append(guardar, cancelar);
  app.replaceChildren(volver, h, card, cardE, barra);
  if (nueva) iTit.focus();
}

(async () => {
  const s = await Aula.listo;
  document.getElementById("quien").textContent = Aula.quien(s);
  document.getElementById("salir").onclick = () => Aula.salir();
  const p = new URLSearchParams(location.search);
  if (p.get("editar")) vistaEditor({ id: p.get("editar") });
  else if (p.has("nueva")) vistaEditor(null);
  else vistaLista();
})();
</script>
</body>
</html>
