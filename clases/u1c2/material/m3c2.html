<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- FICHA DEL MATERIAL: esto es lo que ve el alumno en la carpeta de la clase -->
<meta name="material-titulo" content="Reto del sistema operativo">
<meta name="material-tipo" content="juego">
<meta name="material-descripcion" content="Juego para el celular: tres rondas rápidas sobre el sistema operativo. Al final toma captura de tu nota y envíala al chat.">
<title>Reto del sistema operativo</title>
<script src="../../../conexion/aula.js" data-proteger data-sin-barra></script>
<link rel="icon" type="image/png" href="../../../conexion/img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  :root { --ink: #10231c; --paper: #f6f4ee; --moss: #35513f; --amber: #b3752c; --line: #d8d3c4; --mut: #7c7763; --soft: #ece8dc; --ok: #2f7d4a; --bad: #b3362c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 14px 14px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .top { display: flex; justify-content: space-between; align-items: center; color: #cfe3d3; font: 600 .8rem "IBM Plex Mono", monospace; margin-bottom: 10px; min-height: 22px; }
  .top b { color: #f0c27b; font-size: 1rem; }
  .prog { display: flex; gap: 4px; margin-bottom: 12px; }
  .prog i { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.15); }
  .prog i.bien { background: #4ade80; } .prog i.malo { background: #f87171; } .prog i.act { background: #f0c27b; }
  .tarjeta { background: var(--paper); border-radius: 22px; padding: 22px 18px; flex: 1; display: flex; flex-direction: column; animation: entra .3s ease both; }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } }
  .eti { font: 600 .74rem "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--moss); margin: 0 0 8px; }
  h1 { font-size: 2rem; line-height: 1.1; margin: 0 0 10px; letter-spacing: -.02em; }
  h2 { font-size: 1.35rem; line-height: 1.25; margin: 0 0 14px; }
  p { line-height: 1.5; margin: 0 0 12px; }
  .grande { font-size: 4.2rem; text-align: center; margin: 6px 0 8px; line-height: 1.1; }
  .item { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 18px; word-break: break-word; }
  .item small { display: block; font: 600 .8rem "IBM Plex Mono", monospace; color: var(--mut); margin-top: 4px; }
  .ops { display: grid; gap: 10px; margin-top: auto; }
  .ops.dos { grid-template-columns: 1fr 1fr; }
  .ops button { font: 700 1.05rem "IBM Plex Sans", sans-serif; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 16px 12px; cursor: pointer; color: var(--ink); text-align: left; min-height: 58px; }
  .ops.dos button { text-align: center; min-height: 92px; }
  .ops.dos button span { display: block; font-size: 2rem; }
  .ops button:active { transform: scale(.98); }
  .ops button.bien { background: #eaf4ec; border-color: var(--ok); }
  .ops button.malo { background: #f8e9e6; border-color: var(--bad); }
  .ops button:disabled { cursor: default; }
  .fb { border-radius: 14px; padding: 12px 14px; margin-top: 12px; font-weight: 600; line-height: 1.4; animation: entra .25s ease both; }
  .fb.ok { background: #eaf4ec; color: var(--ok); } .fb.mal { background: #f8e9e6; color: var(--bad); }
  .bt { font: 700 1.05rem "IBM Plex Sans", sans-serif; background: var(--amber); color: #fff; border: 0; border-radius: 16px; padding: 16px; cursor: pointer; width: 100%; margin-top: 12px; }
  .bt.sec { background: #fff; color: var(--moss); border: 2px solid var(--moss); }
  input.nom { width: 100%; font: 600 1.1rem "IBM Plex Sans", sans-serif; padding: 14px; border: 2px solid var(--line); border-radius: 14px; margin: 4px 0 4px; }
  input.nom:focus { outline: none; border-color: var(--moss); }
  .rondas { display: grid; gap: 8px; margin: 8px 0 14px; }
  .rondas > div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .rondas span { font-size: 1.6rem; }
  .nota { text-align: center; font: 700 5rem "IBM Plex Sans", sans-serif; color: var(--moss); line-height: 1; margin: 8px 0 0; }
  .nota small { font-size: 1.6rem; color: var(--mut); }
  .resumen { display: grid; gap: 6px; margin: 14px 0; }
  .resumen div { display: flex; justify-content: space-between; background: #fff; border-radius: 10px; padding: 10px 12px; font-weight: 600; }
  .sello { text-align: center; font: 600 .78rem "IBM Plex Mono", monospace; color: var(--mut); margin-top: 6px; }
  .confeti { position: fixed; top: -20px; font-size: 1.4rem; pointer-events: none; animation: cae linear forwards; z-index: 9; }
  @keyframes cae { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<main class="app">
  <div class="top"><span id="t-ronda"></span><span>⭐ <b id="t-pts">0</b></span></div>
  <div class="prog" id="prog"></div>
  <section class="tarjeta" id="tj"></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mezclar = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
let AC = null;
function tono(f, d = .15, tipo = "sine") { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(.0001, AC.currentTime); g.gain.exponentialRampToValueAtTime(.2, AC.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d + .05); } catch (_) {} }
const vibrar = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };

/* ---------- banco de preguntas ---------- */
const R1 = [  // ¿sistema operativo o aplicación?
  ["Android", "🤖", "so"], ["WhatsApp", "💬", "app"], ["Windows 11", "🪟", "so"], ["TikTok", "🎵", "app"], ["iOS", "🍎", "so"],
  ["Google Chrome", "🌐", "app"], ["Linux", "🐧", "so"], ["Microsoft Word", "📘", "app"], ["macOS", "💻", "so"], ["Instagram", "📸", "app"],
  ["HarmonyOS", "🌸", "so"], ["YouTube", "▶️", "app"], ["Ubuntu", "🟠", "so"], ["Google Docs", "📝", "app"], ["ChromeOS", "💻", "so"],
];
const R2 = [  // ¿con qué lo abre el SO?
  ["informe.docx", ["Word o Google Docs", "Excel", "Reproductor de música", "Fotos"], 0],
  ["notas.xlsx", ["Excel o Google Sheets", "Word", "Reproductor de video", "Bloc de notas"], 0],
  ["guia.pdf", ["Lector de PDF o el navegador", "Calculadora", "Reproductor de música", "Excel"], 0],
  ["selfie.jpg", ["Fotos o Galería", "Word", "Excel", "Reproductor de música"], 0],
  ["cancion.mp3", ["Reproductor de música", "Fotos", "Word", "Lector de PDF"], 0],
  ["clase.mp4", ["Reproductor de video", "Bloc de notas", "Excel", "Calculadora"], 0],
  ["instalar.exe", ["Es un programa: se ejecuta (¡cuidado con su origen!)", "Fotos", "Word", "Reproductor de música"], 0],
  ["exposicion.pptx", ["PowerPoint o Google Slides", "Excel", "Fotos", "Reproductor de video"], 0],
];
const R3 = [  // preguntas rápidas
  ["¿Qué es lo primero que se carga al encender la computadora (después de la BIOS)?", ["El sistema operativo", "WhatsApp", "El antivirus", "El navegador"], 0, "El SO se carga primero; sin él no se abre ningún otro programa."],
  ["Al encender, el SO se copia del disco a…", ["La memoria RAM", "La impresora", "El monitor", "La USB"], 0, "Desde la RAM el procesador trabaja mucho más rápido."],
  ["Tu celular se pone lento con muchas apps abiertas porque…", ["Se llena la RAM", "Se gasta la pantalla", "Se borra el SO", "Se apaga el Wi-Fi"], 0, "Con la RAM llena, el SO usa el disco como memoria y todo va más lento."],
  ["En la línea de comandos de 1981, ¿qué comando muestra lo que hay en una carpeta?", ["DIR", "DEL", "CLS", "REN"], 0, "DIR muestra la lista de archivos y carpetas."],
  ["Borraste un archivo con el comando DEL. ¿Puedes recuperarlo de la Papelera?", ["No: DEL lo borra para siempre", "Sí, siempre", "Solo los lunes", "Sí, con TYPE"], 0, "En MS-DOS no existía la Papelera."],
  ["Tu celular cerró solo una app que tenías abierta. ¿Por qué?", ["Para liberar memoria RAM", "Por un virus", "Se malogró la pantalla", "Para ahorrar datos"], 0, "Si la RAM no alcanza, el SO cierra la app que usaste hace más tiempo."],
  ["Te llega: «Tu cuenta será bloqueada, actualiza tus datos aquí: bit.ly/…». ¿Qué haces?", ["Borrarlo y llamar al número oficial del banco", "Abrir el enlace rápido", "Reenviarlo a mis contactos", "Responder con mi clave"], 0, "Ningún banco te pide tu clave por mensaje: es una estafa."],
  ["El sistema operativo, en realidad, es…", ["Un conjunto de miles de archivos que trabajan en cadena", "Magia dentro del procesador", "Un cable especial", "La pantalla"], 0, "Arranque, núcleo, servicios, escritorio… cada archivo llama al siguiente."],
  ["Una linterna pide permiso para ver tus contactos. ¿Qué haces?", ["Rechazar: no lo necesita", "Permitir siempre", "Apagar el celular", "Borrar Android"], 0, "Si el permiso no tiene que ver con la app, recházalo."],
  ["Escribiste un texto y se fue la luz sin guardarlo. ¿Qué pasó?", ["Se perdió: estaba solo en la RAM", "Se guardó solo en el disco", "Se imprimió", "Se envió por correo"], 0, "Lo que no guardas vive en la RAM, que se borra al cortarse la energía."],
  ["¿Por qué es importante actualizar el SO?", ["Tapa huecos de seguridad y corrige errores", "Para que gaste más batería", "Para borrar tus fotos", "No sirve de nada"], 0, "Las actualizaciones protegen contra virus y arreglan fallas."],
  ["Si una app “no responde”, ¿dónde la cierras a la fuerza en Windows?", ["Administrador de tareas", "Papelera", "Calculadora", "Bloc de notas"], 0, "El Administrador de tareas permite «Finalizar tarea»."],
];

/* ---------- juego ---------- */
let nombre = "", etapa = "inicio", ronda = 0, items = [], k = 0, pts = 0, res = [], porRonda = [0, 0, 0];
const RONDAS = [
  { n: "Ronda 1 · ¿SO o app?", e: "⚙️", d: "¿Es un sistema operativo o una aplicación?", cant: 8 },
  { n: "Ronda 2 · ¿Con qué se abre?", e: "📁", d: "Mira la extensión del archivo y elige con qué programa lo abre el SO.", cant: 5 },
  { n: "Ronda 3 · Preguntas rápidas", e: "⚡", d: "Lo que vimos hoy en clase.", cant: 7 },
];
const TOTAL = RONDAS.reduce((a, r) => a + r.cant, 0);   // 20
function pintarTop() {
  $("#t-ronda").textContent = etapa === "jugar" ? RONDAS[ronda].n : "";
  $("#t-pts").textContent = pts;
  $("#prog").innerHTML = etapa === "jugar" ? items.map((_, j) => `<i class="${res[j] === true ? "bien" : res[j] === false ? "malo" : j === k ? "act" : ""}"></i>`).join("") : "";
}
function inicio() {
  etapa = "inicio"; pintarTop();
  $("#tj").innerHTML = `<p class="eti">Herramientas Informáticas · Clase 2</p><h1>Reto del sistema operativo</h1><div class="grande">🖥️📱</div>
    <div class="rondas">${RONDAS.map(r => `<div><span>${r.e}</span><div><b>${r.n}</b><br><small>${r.cant} preguntas</small></div></div>`).join("")}</div>
    <label for="nom"><b>Tu nombre</b></label><input class="nom" id="nom" maxlength="40" placeholder="Ej.: Ana Quispe" autocomplete="name">
    <button class="bt" id="empezar">¡Empezar! 🚀</button>`;
  try { $("#nom").value = localStorage.getItem("m3c2-nombre") || ""; } catch (_) {}
  $("#empezar").onclick = () => {
    nombre = $("#nom").value.trim();
    if (!nombre) { $("#nom").focus(); $("#nom").style.borderColor = "var(--bad)"; return; }
    try { localStorage.setItem("m3c2-nombre", nombre); } catch (_) {}
    pts = 0; porRonda = [0, 0, 0]; empezarRonda(0);
  };
}
function empezarRonda(r) {
  ronda = r; etapa = "intro"; pintarTop();
  const R = RONDAS[r];
  $("#tj").innerHTML = `<p class="eti">${R.n}</p><div class="grande">${R.e}</div><h2>${R.d}</h2><p style="color:var(--mut)">${R.cant} preguntas · 1 punto cada una</p><button class="bt" id="go" style="margin-top:auto">Comenzar ronda ▸</button>`;
  $("#go").onclick = () => {
    items = mezclar([R1, R2, R3][r]).slice(0, R.cant); k = 0; res = []; etapa = "jugar"; pregunta();
  };
}
function pregunta() {
  pintarTop();
  const it = items[k];
  if (ronda === 0) {
    $("#tj").innerHTML = `<p class="eti">¿Qué es?</p><div class="grande">${it[1]}</div><div class="item">${esc(it[0])}</div><div class="ops dos"><button data-v="so"><span>⚙️</span>Sistema operativo</button><button data-v="app"><span>📱</span>Aplicación</button></div><div id="fb"></div>`;
  } else if (ronda === 1) {
    const ops = mezclar(it[1].map((t, j) => [t, j]));
    $("#tj").innerHTML = `<p class="eti">¿Con qué programa lo abre el SO?</p><div class="grande">📄</div><div class="item">${esc(it[0].split(".")[0])}<span style="color:var(--amber)">.${esc(it[0].split(".")[1])}</span><small>extensión: .${esc(it[0].split(".")[1])}</small></div><div class="ops">${ops.map(([t, j]) => `<button data-v="${j}">${esc(t)}</button>`).join("")}</div><div id="fb"></div>`;
  } else {
    const ops = mezclar(it[1].map((t, j) => [t, j]));
    $("#tj").innerHTML = `<p class="eti">Pregunta ${k + 1} de ${items.length}</p><h2>${esc(it[0])}</h2><div class="ops">${ops.map(([t, j]) => `<button data-v="${j}">${esc(t)}</button>`).join("")}</div><div id="fb"></div>`;
  }
  $("#tj").querySelectorAll(".ops button").forEach(b => b.onclick = () => responder(b));
}
function responder(b) {
  const it = items[k];
  const correcta = ronda === 0 ? it[2] : String(it[2]);
  const ok = b.dataset.v === correcta;
  res[k] = ok; if (ok) { pts++; porRonda[ronda]++; }
  $("#tj").querySelectorAll(".ops button").forEach(x => { x.disabled = true; if (x.dataset.v === correcta) x.classList.add("bien"); });
  if (!ok) b.classList.add("malo");
  const expl = ronda === 0 ? (it[2] === "so" ? `${it[0]} es un <b>sistema operativo</b>.` : `${it[0]} es una <b>aplicación</b>: funciona encima del SO.`) : ronda === 1 ? `El SO lo abre con: <b>${esc(it[1][0])}</b>.` : esc(it[3]);
  $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "mal"}">${ok ? "✔ ¡Correcto! " : "✘ Casi. "}${expl}</div><button class="bt" id="sig">${k === items.length - 1 ? (ronda === 2 ? "Ver mi nota 🏁" : "Siguiente ronda ▸") : "Siguiente ▸"}</button>`;
  tono(ok ? 660 : 200, .2, ok ? "sine" : "sawtooth"); if (!ok) vibrar(120);
  pintarTop();
  $("#sig").onclick = () => { if (k < items.length - 1) { k++; pregunta(); } else if (ronda < 2) empezarRonda(ronda + 1); else final(); };
  $("#sig").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function final() {
  etapa = "final"; pintarTop();
  const nota = Math.round(pts / TOTAL * 20), msj = nota >= 18 ? "¡Excelente! 🏆" : nota >= 14 ? "¡Muy bien! 👏" : nota >= 11 ? "¡Aprobado! 💪" : "Repasa la presentación y vuelve a intentarlo 📚";
  const d = new Date();
  $("#tj").innerHTML = `<p class="eti">Resultado final</p><h2 style="margin-bottom:0">${esc(nombre)}</h2><p class="nota">${nota}<small>/20</small></p><p style="text-align:center;font-weight:700;font-size:1.15rem;margin-top:8px">${msj}</p>
    <div class="resumen">${RONDAS.map((r, j) => `<div><span>${r.e} ${r.n.split(" · ")[1]}</span><span>${porRonda[j]} / ${r.cant}</span></div>`).join("")}</div>
    <p style="text-align:center">📸 <b>Toma una captura de esta pantalla</b> y envíala al chat de la clase.</p>
    <p class="sello">Clase 2 · El sistema operativo · ${d.toLocaleDateString("es-PE")} ${d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" })}</p>
    <button class="bt sec" id="otra">↺ Jugar otra vez</button>`;
  $("#otra").onclick = inicio;
  if (nota >= 14) { [523, 659, 784, 1047].forEach((f, j) => setTimeout(() => tono(f, .25), j * 120)); for (let j = 0; j < 30; j++) { const c = document.createElement("span"); c.className = "confeti"; c.textContent = ["🎉", "⭐", "✨", "🎊"][j % 4]; c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = 2 + Math.random() * 2 + "s"; c.style.animationDelay = Math.random() * .8 + "s"; document.body.append(c); setTimeout(() => c.remove(), 5000); } }
}
inicio();
</script>
</body>
</html>
