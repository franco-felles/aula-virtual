  q.fillStyle='#ffd84a';q.font='bold 15px sans-serif';q.fillText('⌨️ Teclado no detectado',256,230);scrTex.needsUpdate=true;return}
 q.fillStyle='rgba(0,0,0,.35)';q.fillRect(0,H-26,W,26);q.fillStyle='#fff';q.fillRect(86,40,340,170);q.fillStyle='#15203b';q.font='bold 24px sans-serif';q.fillText('🎉 ¡Tu PC funciona!',256,96);
 q.font='15px sans-serif';q.fillStyle='#55627f';q.fillText('La armaste desde cero, pieza por pieza.',256,130);q.fillText('Entrada → Proceso → Salida ✔',256,156);q.fillText('Tiempo: '+fmt((tEnd||performance.now())-t0),256,186);
 scrTex.needsUpdate=true}

// ===================== CONFETI =====================
const fx=$('fx'),fq=fx.getContext('2d');let conf=[];
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const w=fx.width=wrap.clientWidth,h=fx.height=wrap.clientHeight;
 conf=Array.from({length:160},()=>({x:w/2+(Math.random()-.5)*w*.3,y:h*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*6.28,c:['#2f63e0','#22c55e','#ffd84a','#ef4444','#a855f7','#f97316'][Math.random()*6|0]}))}
function drawConf(){if(!conf.length)return;fq.clearRect(0,0,fx.width,fx.height);conf.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=.15;fq.save();fq.translate(p.x,p.y);fq.rotate(p.r);fq.fillStyle=p.c;fq.fillRect(-4,-2.5,8,5);fq.restore()});
 conf=conf.filter(p=>p.y<fx.height+20);if(!conf.length)fq.clearRect(0,0,fx.width,fx.height)}

// ===================== PANEL =====================
PIECES.forEach(k=>{const b=document.createElement('button');b.textContent=NAME[k].split(' (')[0];b.dataset.k=k;b.onclick=()=>pickPiece(k);$('bpz').appendChild(b)});
CK.forEach(c=>{const b=document.createElement('button');b.textContent=CAB[c].n;b.dataset.c=c;b.onclick=()=>pickCable(c);$('bcb').appendChild(b)});
$('swb').onclick=toggleSw;$('pwr').onclick=powerBtn;
$('gl').innerHTML=STEPS.map(s=>'<li>'+s.t+(s.q?'<small>❓ '+s.q+'</small>':'')+'</li>').join('');
function refresh(){const i=curStep(),n=STEPS.length,s=STEPS[i];
 $('sn').textContent=mode==='guia'?(i<n?'Paso '+(i+1)+' de '+n:'¡Completado!'):'Desafío · '+STEPS.filter(stepDone).length+' de '+n;
 $('pb').style.width=(STEPS.filter(stepDone).length/n*100)+'%';
 if(won){$('st').textContent='🎉 ¡Lo lograste!';$('sd').innerHTML='Armaste y encendiste tu PC en <b>'+fmt(tEnd-t0)+'</b> con <b>'+errs+'</b> error'+(errs===1?'':'es')+' y <b>'+tries+'</b> intento'+(tries===1?'':'s')+' de encendido.<br>¿Te animas a intentarlo en modo 🏆 Desafío?';$('sq').style.display='none'}
 else if(mode==='guia'&&s){$('st').textContent=s.t;$('sd').textContent=s.d;if(s.q){$('sq').innerHTML='<b>❓ Pregunta para pensar:</b> '+s.q;$('sq').style.display='block'}else $('sq').style.display='none'}
 else{$('st').textContent='🏆 Desafío: arma la PC sin ayuda';$('sd').textContent='Instala todas las piezas, conecta los cables y enciéndela. Si no arranca, lee el diagnóstico y descubre qué falta.';$('sq').style.display='none'}
 const hintOn=mode==='guia'&&!won&&s;
 document.querySelectorAll('#bpz button').forEach(b=>{const k=b.dataset.k;b.classList.toggle('done',inst(k));b.classList.toggle('held',!!held&&held.k===k);b.classList.toggle('hint',!!hintOn&&s.k===k&&!held)});
 document.querySelectorAll('#bcb button').forEach(b=>{const c=b.dataset.c;b.classList.toggle('done',CS[c].on);b.classList.toggle('held',!!held&&held.k===c);b.classList.toggle('hint',!!hintOn&&s.c===c&&!held)});
 $('swb').textContent=sw?'Interruptor: I (encendido)':'Interruptor: O (apagado)';$('swb').classList.toggle('done',sw);$('swb').classList.toggle('hint',!!hintOn&&!!s.sw);
 $('pwr').textContent=power?'⏻ Apagar la PC':'⏻ Encender la PC';$('pwr').classList.toggle('on',power);$('pwr').classList.toggle('hint',!!hintOn&&!!s.pw&&!power);
 [...$('gl').children].forEach((li,j)=>{li.className=stepDone(STEPS[j])?'ok':j===i?'cur':''});
 const hd=$('hold');if(held){hd.style.display='block';hd.textContent=held.t==='p'?'✋ Tienes: '+NAME[held.k]+' · toca su lugar en el gabinete (Esc para soltar)':'🔌 Tienes el cable '+CAB[held.k].n+' · toca su conector (Esc para soltar)'}else hd.style.display='none';
 pwLed.material.color.setHex(power?0x3ddc84:0x444444);psuSw.material.color.setHex(sw?0x3ddc84:0xe5484d);psuSw.rotation.x=sw?-.35:.35;
 updStats()}
function updStats(){$('stats').textContent='⏱ '+fmt(t0?((tEnd||performance.now())-t0):0)+' · ❌ '+errs}
setInterval(updStats,1000);
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));$('guide').open=false;refresh()});
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('reset').onclick=()=>{if(!confirm('¿Desarmar todo y empezar de nuevo?'))return;powerOff(true);held=null;sw=false;won=false;errs=tries=t0=tEnd=0;
 PIECES.forEach(k=>{ST[k].inst=false;ST[k].h.visible=true});blob.visible=false;CK.forEach(c=>{if(CS[c].on)cableOff(c)});$('pmsg').style.display='none';conf=[];fq.clearRect(0,0,fx.width,fx.height);setView('mesa');refresh()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&e.detail>0)b.blur()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&held)hold(null)});

// ===================== CÁMARA =====================
let th=0,ph=1.05,rad=22,tr=22,vt=null,vp=null;
const target=new THREE.Vector3(0,-1.4,1.4),tg=target.clone();
function mesaR(){const a=camera.aspect||1.6;return Math.min(46,Math.max(16,27/a+7))}
function setView(v){view=v;document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='pc'){tg.set(0,.1,0);tr=11.5;vt=.25;vp=1.3}else{tg.set(0,-1.4,1.4);tr=mesaR();vt=0;vp=1.05}}
function cam(){camera.position.set(target.x+rad*Math.sin(ph)*Math.sin(th),target.y+rad*Math.cos(ph),target.z+rad*Math.sin(ph)*Math.cos(th));camera.lookAt(target)}
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();if(view==='mesa')tr=mesaR()}
addEventListener('resize',resize);

// ===================== PUNTERO =====================
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function shownSlots(){if(!held||held.t!=='p')return[];return PIECES.filter(p=>!inst(p)&&(p===held.k||reqOk(p)))}
function shownPorts(){if(!held||held.t!=='c')return[];return mode==='guia'?[held.k]:CK.filter(c=>!CS[c].on&&CAB[c].need.every(inst))}
function hits(e,list){const r=wrap.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);return ray.intersectObjects(list,false)}
function slotHits(e){const sl=shownSlots();return hits(e,ghostMeshes.filter(o=>sl.includes(o.userData.slot)))}
function portHits(e){const sp=shownPorts();return hits(e,sp.map(c=>CS[c].port))}
function objAt(e){const h=hits(e,pickAll.filter(o=>{let p=o;while(p){if(!p.visible)return false;p=p.parent}return true}))[0];return h?h.object:null}
function handleClick(e){
 if(held&&held.t==='p'){const hs=slotHits(e);if(hs.length){const own=hs.find(h=>h.object.userData.slot===held.k);return tryInstall(held.k,(own||hs[0]).object.userData.slot)}}
 if(held&&held.t==='c'){const hs=portHits(e);if(hs.length){const own=hs.find(h=>h.object.userData.port===held.k);return tryConnect(held.k,(own||hs[0]).object.userData.port)}}
 const o=objAt(e);
 if(!o){if(held)hold(null);return}
 if(o.userData.pw)return powerBtn();
 if(o.userData.sw&&inst('psu')&&!held)return toggleSw();
 if(o.userData.cable){if(held)return hold(null);return pickCable(o.userData.cable)}
 if(o.userData.fix){if(held)return hold(null);const f=o.userData.fix;return toast(f==='mon'?'🖥️ El monitor ya está en la mesa: se conecta con el cable HDMI.':f==='strip'?'🔌 La zapatilla da la electricidad: conecta ahí el cable de corriente.':'⌨️🖱️ Teclado y mouse se conectan con el cable USB.')}
 if(o.userData.key){if(held&&held.t==='p'&&inst(o.userData.key))return hold(null);return pickPiece(o.userData.key)}}
function hoverName(e){if(held&&held.t==='p'){const h=slotHits(e)[0];if(h)return{n:mode==='guia'?'Lugar de: '+NAME[h.object.userData.slot]:'¿Va aquí?',slot:h.object.userData.slot}}
 if(held&&held.t==='c'){const h=portHits(e)[0];if(h)return{n:mode==='guia'?'Conector: '+CAB[h.object.userData.port].n:'¿Este conector?',port:h.object.userData.port}}
 const o=objAt(e);if(!o)return null;
 if(o.userData.pw)return{n:'⏻ Botón de encendido'};if(o.userData.sw&&inst('psu'))return{n:'Interruptor de la fuente ('+(sw?'I':'O')+')'};
 if(o.userData.cable)return{n:'Cable '+CAB[o.userData.cable].n+' (toca para desconectar)'};if(o.userData.fix)return{n:FIXN[o.userData.fix]};
 if(o.userData.key)return{n:NAME[o.userData.key]+(inst(o.userData.key)?' (toca para quitar)':''),key:o.userData.key};return null}
let drag=null;
wrap.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,m:0};wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;if(drag.m>6){vt=vp=null;th-=dx*.008;ph=Math.min(2.4,Math.max(.35,ph-dy*.008));tip.style.display='none';return}}
 hover=hoverName(e);const r=wrap.getBoundingClientRect();
 if(hover){tip.style.display='block';tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.textContent=hover.n;wrap.style.cursor='pointer'}else{tip.style.display='none';wrap.style.cursor='grab'}});
wrap.addEventListener('pointerup',e=>{if(drag&&drag.m<6)handleClick(e);drag=null});
wrap.addEventListener('pointerleave',()=>{if(!drag){hover=null;tip.style.display='none'}});
wrap.addEventListener('wheel',e=>{e.preventDefault();tr=Math.min(46,Math.max(4,tr+e.deltaY*.012))},{passive:false});
const pts=new Map();let pd=0;
wrap.addEventListener('pointerdown',e=>pts.set(e.pointerId,e));
wrap.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)tr=Math.min(46,Math.max(4,tr-(d-pd)*.03));pd=d}});
['pointerup','pointercancel'].forEach(t=>wrap.addEventListener(t,e=>{pts.delete(e.pointerId);pd=0}));

// ===================== ANIMACIÓN =====================
const tmpC=new THREE.Color();
function setEm(obj,hex,s){obj.traverse(o=>{if(o.isMesh&&o.material.emissive){tmpC.setHex(hex).multiplyScalar(s);o.material.emissive.copy(tmpC)}})}
function loop(){requestAnimationFrame(loop);const now=performance.now(),pulse=.5+.5*Math.sin(now*.006);
 const s=STEPS[curStep()],guia=mode==='guia'&&!won;
 PIECES.forEach(k=>{const p=ST[k];let pos,q;
  if(p.inst){pos=p.ip;q=p.iq}else if(held&&held.t==='p'&&held.k===k){pos=p.tp.clone().add(new THREE.Vector3(0,1.1+Math.sin(now*.004)*.08,0));q=p.tq}else{pos=p.tp;q=p.tq}
  p.h.position.lerp(pos,.14);p.h.quaternion.slerp(q,.14);
  if(k==='paste'&&p.inst&&p.hideAt&&now>p.hideAt){p.h.visible=false;blob.visible=true;p.hideAt=0}
  const hv=hover&&hover.key===k,hl=held&&held.t==='p'&&held.k===k,gd=guia&&s&&s.k===k&&!p.inst&&!held;
  setEm(p.h,hl?0xffb020:hv?0x2a55ff:gd?0x22c55e:0,hl?.6:hv?1:gd?pulse*.9:0)});
 const sl=shownSlots();
 PIECES.forEach(k=>{const gh=ST[k].ghost,on=sl.includes(k);gh.visible=on;if(!on)return;const m=gh.userData.mat,right=held.k===k&&guia,hv=hover&&hover.slot===k;
  m.color.setHex(right?0x22c55e:0x9aa6c4);m.opacity=hv?.55:right?.22+.25*pulse:.18});
 const sp=shownPorts();
 CK.forEach(c=>{const S=CS[c],on=sp.includes(c);S.port.visible=on;S.ghost.visible=on&&guia&&held.k===c;
  if(on){S.port.material.color.setHex(guia&&held.k===c?0x22c55e:0xffc83d);S.port.scale.setScalar((hover&&hover.port===c?1.5:1)+.25*pulse)}});
 setEm(pwBtn,0x22c55e,guia&&s&&s.pw&&!power?pulse:0);setEm(psuSw,0x22c55e,guia&&s&&s.sw&&inst('psu')?pulse:0);
 spin.forEach(({f,k})=>{const on=power&&boot&&(k==='psu'||(k==='cooler'&&inst('cooler'))||(k==='gpu'&&CS.pcie.on));if(on&&inst(k))f.rotation.z+=.25});
 target.lerp(tg,.08);rad+=(tr-rad)*.08;
 if(vt!==null){th+=(vt-th)*.08;if(Math.abs(vt-th)<.01)vt=null}
 if(vp!==null){ph+=(vp-ph)*.08;if(Math.abs(vp-ph)<.01)vp=null}
 drawScreen();drawConf();cam();renderer.render(scene,camera)}
resize();rad=tr=mesaR();refresh();drawScreen();loop();
toast('👋 Las piezas están sobre la mesa. ¡Vamos a armar una PC!',null,3500);
</script>
