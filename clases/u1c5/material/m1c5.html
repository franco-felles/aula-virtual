<style>
  :root { --ink: #10231c; --paper: #f6f4ee; --moss: #35513f; --line: #d8d3c4; --mut: #6f6a57; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header div { flex: 1; min-width: 220px; }
  .eti { font: 600 .72rem "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--moss); margin: 0; }
  h1 { font-size: 1.25rem; margin: 2px 0 0; }
  .bt { font: 600 .92rem "IBM Plex Sans", sans-serif; background: var(--moss); color: #fff; border: 0; border-radius: 99px; padding: 9px 16px; text-decoration: none; white-space: nowrap; }
  .bt.sec { background: #fff; color: var(--moss); border: 1.5px solid var(--moss); }
  iframe { flex: 1; width: 100%; border: 0; background: #525659; }
  .movil { display: none; padding: 24px 16px; color: var(--mut); }
  @media (max-width: 700px) { iframe { display: none; } .movil { display: block; } }
</style>
</head>
<body>
<header>
  <div>
    <p class="eti">Guía práctica · PDF</p>
    <h1>Google Docs: ordena tu documento</h1>

</header>
<iframe src="recursos/m1c5/guia-google-docs.pdf#view=FitH" title="Guía de Google Docs"></iframe>
<p class="movil">En el celular el PDF se ve mejor en su propia pestaña: toca <b>Abrir en otra pestaña</b> o <b>Descargar PDF</b>.</p>
</body>
