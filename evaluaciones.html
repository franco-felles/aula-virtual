<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluaciones continuas - Aula Virtual</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#6b7385;--ec:#1b7f3b;--ec-d:#14632d;--ec-bg:#e3f4e8;--line:#e1e5ee;--err:#c62828}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:560px}
  h1{font-size:1.5rem;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ec);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(20,30,60,.05);margin-bottom:14px}
  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  input{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--ec);border-color:transparent}
  .pw{position:relative;display:flex;align-items:center}
  .pw input{padding-right:48px}
  .eye{position:absolute;right:12px;background:none;border:0;cursor:pointer;font-size:1.2rem;color:var(--muted);padding:0}
  button{font:inherit;cursor:pointer}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--ec);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%;margin-top:12px}
  .btn:hover{background:var(--ec-d)}
  .ghost{background:none;border:0;color:var(--ec-d);padding:0;font-size:.9rem;margin-top:14px}
  ul.results{list-style:none;margin:12px 0 0;padding:0;max-height:340px;overflow:auto}
  ul.results li{border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  ul.results button{width:100%;text-align:left;background:#fff;border:0;border-radius:10px;padding:11px 14px;color:var(--ink)}
  ul.results button:hover{background:var(--ec-bg)}
  .tag{display:inline-block;font-size:.75rem;background:var(--ec-bg);color:var(--ec-d);border-radius:6px;padding:2px 7px;margin-left:6px;font-weight:700}
  .hint,.empty{color:var(--muted);font-size:.9rem;margin-top:12px}
  .name{font-weight:700;font-size:1.05rem}
  .err{color:var(--err);font-size:.9rem;margin-top:10px;min-height:1.2em}
  .ok{color:var(--ec);font-weight:700;margin:0 0 8px}
  .hidden{display:none}
  .lista a{display:block;margin-bottom:8px}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ==========================================================
   EVALUACIONES CONTINUAS  (un solo HTML para todas)

   Carpeta:  eecc/ec1u1.csv, eecc/ec2u2.csv ...   (ec<N>u<U>.csv)

   Tiene 3 modos según la URL:
     evaluaciones.html?detectar=1   -> invisible: revisa eecc/ y le avisa
                                       al portal (index.html) qué EC existen
     evaluaciones.html?ec=ec1u1     -> el alumno busca su nombre y abre su doc
     evaluaciones.html              -> lista de las EC disponibles

   Columnas del CSV (encabezados en la primera fila, o en las primeras 6 si hay una fila de título; da igual
   mayúsculas/tildes y que separes con coma o punto y coma):
     NOMBRE   (obligatoria)  también vale ALUMNO / APELLIDOS Y NOMBRES
     LINK     (obligatoria)  el enlace a su documento (también ENLACE / URL)
     CODIGO   (opcional)     si existe, se pide como contraseña
     GRUPO    (opcional)     se muestra como etiqueta
     MAQUINA  (opcional)     también se puede buscar por máquina
   ========================================================== */
const UNIDADES = [1, 2];     // unidades que existen
const MAX_EC   = 6;          // cuántas EC por unidad se buscan (ec1u1 ... ec6u1)
const CARPETA  = "eecc/";

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);

/* ---------- utilidades ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const etiquetaEC = (num, u) => `Evaluación continua ${num} · Unidad ${u}`;

/** Parser CSV: comillas, BOM, y separador coma o punto y coma (autodetectado). */
function parseCSV(texto) {
  texto = texto.replace(/^\uFEFF/, "");
  const primera = texto.split(/\r?\n/).slice(0, 6).join("\n");
  const sep = (primera.match(/;/g) || []).length > (primera.match(/,/g) || []).length ? ";" : ",";
  const filas = []; let fila = [], campo = "", q = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (q) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') q = false;
      else campo += c;
    } else if (c === '"') q = true;
    else if (c === sep) { fila.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      fila.push(campo); campo = "";
      if (fila.some(x => x.trim())) filas.push(fila);
      fila = [];
    } else campo += c;
  }
  fila.push(campo);
  if (fila.some(x => x.trim())) filas.push(fila);
  return filas;
}

/** CSV -> [{nombre, link, codigo, grupo, maquina}] */
function leerAlumnos(texto) {
  const filas = parseCSV(texto);
  const NOMBRES = ["nombre", "alumno", "alumnos", "apellidos y nombres", "apellidos y nombre"];
  const LINKS = ["link", "enlace", "url"];
  // la fila de encabezados puede no ser la primera (p. ej. una fila con el título de la hoja)
  const h = filas.slice(0, 6).findIndex(f => f.map(norm).some(x => NOMBRES.includes(x)) && f.map(norm).some(x => LINKS.includes(x)));
  if (h < 0) { console.warn("[ec] El CSV necesita encabezados NOMBRE (o ALUMNO) y LINK (o ENLACE)."); return []; }
  const cab = filas[h].map(norm);
  const col = (...nombres) => cab.findIndex(x => nombres.includes(x));
  const iN = col(...NOMBRES);
  const iL = col(...LINKS);
  const iC = col("codigo", "codigo de alumno", "clave", "password", "contrasena");
  const iG = col("grupo");
  const iM = col("maquina", "pc");
  return filas.slice(h + 1).map(f => ({
    nombre: (f[iN] || "").trim(),
    link:   (f[iL] || "").trim(),
    codigo: iC >= 0 ? (f[iC] || "").trim() : "",
    grupo:  iG >= 0 ? (f[iG] || "").trim() : "",
    maquina: iM >= 0 ? (f[iM] || "").trim() : ""
  })).filter(a => a.nombre);
}

/** ¿Existe eecc/<id>.csv? (descarta las páginas HTML de error que algunos hostings devuelven) */
async function existeCSV(id) {
  try {
    const r = await fetch(`${CARPETA}${id}.csv`, { cache: "no-store" });
    if (!r.ok) return null;
    if ((r.headers.get("content-type") || "").includes("text/html")) return null;
    const t = await r.text();
    return t.trim() ? t : null;
  } catch { return null; }
}

/** Revisa la carpeta eecc/ buscando ec<N>u<U>.csv */
async function detectarEC() {
  const pruebas = [];
  for (const u of UNIDADES) for (let n = 1; n <= MAX_EC; n++) pruebas.push({ id: `ec${n}u${u}`, num: n, unidad: u });
  const res = await Promise.all(pruebas.map(async p => (await existeCSV(p.id)) ? p : null));
  return res.filter(Boolean).sort((a, b) => a.unidad - b.unidad || a.num - b.num);
}

/* ---------- modo 1: detector invisible (le avisa al portal) ---------- */
async function modoDetectar() {
  const lista = await detectarEC();
  if (window.parent !== window) window.parent.postMessage({ tipo: "aula-ec", lista }, location.origin);
}

/* ---------- modo 3: lista de EC disponibles ---------- */
async function modoLista() {
  app.append(el("h1", "", "Evaluaciones continuas"),
             el("p", "sub", "Elige tu evaluación."));
  const card = el("section", "card lista");
  card.appendChild(el("p", "hint", "Buscando evaluaciones..."));
  app.appendChild(card);
  const lista = await detectarEC();
  card.replaceChildren();
  if (!lista.length) { card.appendChild(el("p", "empty", "No hay evaluaciones continuas disponibles por el momento.")); return; }
  lista.forEach(p => {
    const a = el("a", "btn", etiquetaEC(p.num, p.unidad));
    a.href = "?ec=" + p.id;
    card.appendChild(a);
  });
}

/* ---------- modo 2: el alumno entra a su evaluación ---------- */
async function modoEvaluacion(id) {
  const m = /^ec(\d+)u(\d+)$/i.exec(id);
  if (!m) { app.append(el("h1", "", "Evaluación no válida")); return; }
  const titulo = etiquetaEC(Number(m[1]), Number(m[2]));
  document.title = titulo + " - Aula Virtual";

  const csv = await existeCSV(id.toLowerCase());
  app.append(el("h1", "", titulo));
  if (!csv) { app.append(el("p", "sub", "Esta evaluación aún no está disponible.")); return; }
  const alumnos = leerAlumnos(csv);
  if (!alumnos.length) { app.append(el("p", "sub", "No se pudo leer la lista de alumnos. Avisa a tu docente.")); return; }
  const pideCodigo = alumnos.some(a => a.codigo);

  app.append(el("p", "sub", "Escribe tu nombre o apellido, elígete en la lista" + (pideCodigo ? " y desbloquea tu documento con tu código de alumno." : " y abre tu documento.")));

  /* paso 1: buscar */
  const s1 = el("section", "card");
  const lq = el("label", "", "Tu nombre"); lq.htmlFor = "q";
  const q = el("input"); q.id = "q"; q.type = "search"; q.autocomplete = "off"; q.placeholder = "Ej.: Quispe, Juan Carlos…";
  const ul = el("ul", "results");
  const hint = el("div", "hint", "Escribe al menos 2 letras.");
  s1.append(lq, q, ul, hint);

  /* paso 2: código */
  const s2 = el("section", "card hidden");
  const who = el("div", "name");
  const meta = el("div", "sub"); meta.style.margin = "2px 0 14px";
  const form = el("form"); form.autocomplete = "off";
  const lc = el("label", "", "Código de alumno (contraseña)"); lc.htmlFor = "code";
  const pw = el("div", "pw");
  const code = el("input"); code.id = "code"; code.type = "password"; code.required = true; code.autocapitalize = "characters"; code.spellcheck = false;
  const eye = el("button", "eye", "👁️"); eye.type = "button"; eye.title = "Ver/Ocultar código";
  eye.onclick = () => { code.type = code.type === "password" ? "text" : "password"; };
  pw.append(code, eye);
  const go = el("button", "btn", "Desbloquear documento"); go.type = "submit";
  const err = el("div", "err"); err.setAttribute("role", "alert");
  form.append(lc, pw, go, err);
  const back = el("button", "ghost", "← Buscar otro nombre"); back.type = "button";
  s2.append(who, meta, form, back);

  /* paso 3: listo */
  const s3 = el("section", "card hidden");
  const ok = el("p", "ok", "✔ Documento listo");
  const who2 = el("div", "name");
  const abrir = el("a", "btn", "Abrir mi documento"); abrir.target = "_blank"; abrir.rel = "noopener noreferrer";
  const again = el("button", "ghost", "← Volver al inicio"); again.type = "button";
  s3.append(ok, who2, abrir, again);

  app.append(s1, s2, s3);

  let elegido = null;
  const mostrar = x => { [s1, s2, s3].forEach(s => s.classList.add("hidden")); x.classList.remove("hidden"); };
  const linkSeguro = u => /^https?:\/\//i.test(u);

  function terminar(a) {
    if (!linkSeguro(a.link)) { err.textContent = "Tu enlace no está disponible. Avisa a tu docente."; return; }
    who2.textContent = a.nombre;
    abrir.href = a.link;
    mostrar(s3);
  }
  function elegir(a) {
    elegido = a;
    if (!a.codigo) { terminar(a); return; }
    who.textContent = a.nombre;
    meta.textContent = [a.grupo, a.maquina].filter(Boolean).join(" · ");
    code.value = ""; err.textContent = "";
    mostrar(s2); code.focus();
  }

  q.addEventListener("input", () => {
    ul.replaceChildren();
    const t = norm(q.value);
    if (t.length < 2) { hint.textContent = "Escribe al menos 2 letras."; return; }
    const palabras = t.split(/\s+/);
    const hits = alumnos.filter(a => {
      const base = norm(a.nombre + " " + a.maquina);
      return palabras.every(p => base.includes(p));
    }).slice(0, 30);
    hint.textContent = hits.length ? "" : "No encontramos ese nombre. Revisa la escritura.";
    hits.forEach(a => {
      const li = el("li"); const b = el("button", "", a.nombre); b.type = "button";
      if (a.grupo) b.appendChild(el("span", "tag", a.grupo));
      b.onclick = () => elegir(a);
      li.appendChild(b); ul.appendChild(li);
    });
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    if (norm(code.value) === norm(elegido.codigo)) terminar(elegido);
    else { err.textContent = "Código incorrecto. Inténtalo de nuevo."; code.select(); }
  });
  back.onclick = () => { elegido = null; mostrar(s1); q.focus(); };
  again.onclick = () => { q.value = ""; ul.replaceChildren(); hint.textContent = "Escribe al menos 2 letras."; mostrar(s1); q.focus(); };
}

/* ---------- arranque ---------- */
if (params.get("detectar")) modoDetectar();
else if (params.get("ec")) modoEvaluacion(params.get("ec"));
else modoLista();
</script>
</body>
</html>
