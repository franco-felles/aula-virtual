<head>

<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14233a;--mut:#5b6b82;--pri:#0b4a9c;--pri2:#1b7fc4;--acc:#e8402f;--ok:#1f9d55;--bad:#d64545;--line:#d7e0ec;--soft:#e6eefa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1624;--card:#17233a;--ink:#e8eef8;--mut:#9fb0c8;--pri:#6fa8ff;--pri2:#4fb3e8;--acc:#ff7a6b;--ok:#4ccf86;--bad:#ff7b7b;--line:#2a3b58;--soft:#1f3050}}
:root[data-theme="dark"]{--bg:#0e1624;--card:#17233a;--ink:#e8eef8;--mut:#9fb0c8;--pri:#6fa8ff;--pri2:#4fb3e8;--acc:#ff7a6b;--ok:#4ccf86;--bad:#ff7b7b;--line:#2a3b58;--soft:#1f3050}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{color:var(--pri);font-size:15px}
.tabs{display:flex;gap:6px}header .rs{margin-left:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on{color:#0e1624}}
main{max-width:980px;margin:0 auto;padding:16px}
.hide{display:none!important}
.slide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;min-height:430px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
h1{font-size:34px;margin:0 0 8px;line-height:1.15}h2{font-size:25px;margin:0 0 6px;color:var(--pri)}h3{margin:0 0 4px;font-size:17px}
.sub{color:var(--mut);margin:0 0 14px}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0e1624}}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}
.bar{flex:1;height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .3s}
.cnt{color:var(--mut);font-size:14px;min-width:48px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer;text-align:left;transition:.15s}
.chip:hover{border-color:var(--pri2)}.chip.on{border-color:var(--pri);background:var(--soft)}
.chip .e{font-size:26px;display:block}
.panel{margin-top:12px;background:var(--soft);border-radius:12px;padding:14px;min-height:96px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--ok);color:#fff}.tag.no{background:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.two{grid-template-columns:1fr}h1{font-size:27px}}
ul{margin:6px 0;padding-left:20px}li{margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.doc{background:#fff;color:#222;border:1px solid var(--line);border-radius:6px;padding:16px 20px;font-family:Georgia,"Times New Roman",serif;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.idx div{display:flex;gap:6px;color:#222}.idx div span.d{flex:1;border-bottom:2px dotted #999;margin-bottom:5px}
select,input[type=range]{font:inherit}select{padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.page{background:#fff;color:#222;border:1px solid var(--line);height:290px;padding:18px;display:flex;flex-direction:column;font-family:Georgia,serif;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cls .chip.s1{border-color:var(--pri)}.cls .chip.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.cls .chip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.lab{font-size:12px;font-weight:700;color:var(--pri);display:block;margin-top:4px}
.steps{counter-reset:s;list-style:none;padding:0}.steps li{counter-increment:s;background:var(--soft);padding:10px 14px 10px 50px;border-radius:10px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:12px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri2)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.exp{margin-top:10px;padding:12px;border-radius:10px;background:var(--soft)}
.big{font-size:56px;font-weight:800;color:var(--pri);line-height:1}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#0b4a9c,#1b7fc4);color:#fff;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));animation:in .3s}.ov.on{display:flex}
.ove{font-size:96px;line-height:1.1}.ovk{font-size:18px;letter-spacing:.15em;text-transform:uppercase;opacity:.85;margin-top:8px}.ovt{font-size:clamp(40px,9vw,72px);font-weight:800;line-height:1.1;margin:6px 0}.ovs{font-size:clamp(18px,3.5vw,28px);margin-bottom:26px}
.ov .btn{background:#fff;color:#0b4a9c;font-size:18px;padding:12px 28px}
.sk{cursor:pointer;padding:1px 3px;border-radius:4px;border:1px dashed transparent}.sk:hover{background:#fff3b0}.sk.k{color:#d11;text-decoration:line-through;text-decoration-thickness:2px}.sk.ok{border:1px solid #1f9d55}.sk.bad{border:1px solid #d11;background:#ffe3e3}.opcb{font-size:11px;background:#f5a623;color:#fff;border-radius:99px;padding:1px 8px}
.node{flex:1;min-width:80px;text-align:center;padding:10px 6px;border:2px solid var(--line);border-radius:12px;opacity:.45;transition:.25s}.node.on{opacity:1;border-color:var(--pri);background:var(--soft);transform:translateY(-3px)}
.bp{border:2px dashed transparent;border-radius:6px;padding:6px;cursor:pointer}.bp:hover,.bp.on{border-color:var(--pri2)}
.colz{display:grid;gap:8px;margin-top:8px}.colz div{background:#cfe3f7;color:#14233a;padding:10px;border-radius:6px;font-size:13px}.colz .l{background:#1b7fc4;color:#fff}
.rs{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
#bt{width:100%;border-collapse:collapse}#bt th,#bt td{border:2px solid #666;padding:2px 6px}#bt.w th,#bt.w td{border-color:#fff}
</style>

<body>
<header><b>🖥️ Repaso · Herramientas Informáticas</b>
<button class="rs" id="rs">🔄 Reiniciar repaso</button><div class="tabs"><button class="tab on" id="t1">📖 Clase</button><button class="tab" id="t2">🎯 Quiz</button></div></header>
<div class="ov" id="ov"></div>
<main>
<section id="clase"><div class="slide" id="sl"></div>
<div class="nav"><button class="btn ghost" id="pv">← Anterior</button><div class="bar"><i id="pb"></i></div><span class="cnt" id="pc"></span><button class="btn" id="nx">Siguiente →</button></div></section>
<section id="quiz" class="hide"><div class="slide" id="qz"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const SEC={c1:["🖥️","Clase 1","Partes fundamentales de la computadora"],c2:["📝","Clase 2","Primer contacto con Google Docs"],c3:["📑","Documentos","Índice, tablas e imágenes"],c4:["📐","Clase 4","Sangrías, interlineado y espaciado"],c5:["↔️","Clase 5","Alineación: tipos, esquinas y poema"],c7:["📄","Clase 7","Creación del CV"],c8:["🗂️","Clase 8","Estructura de un trabajo"],q:["🎯","Final","¡A practicar!"]};
const SL=[];const add=(s,f,a)=>SL.push({s,f,a});
const mark=(sel,att,v)=>document.querySelectorAll(sel).forEach(c=>c.classList.toggle("on",c.dataset[att]==v));
/* portada y agenda */
add(null,()=>`<div style="text-align:center;padding:30px 0"><div style="font-size:64px">🧑‍💻</div><h1>Clase de repaso</h1><p class="sub">Herramientas Informáticas · Enfermería Técnica · IESPAL</p><p>Repasaremos clase por clase todo lo que hemos trabajado.</p><p class="sub">Usa ← → del teclado o los botones. Al final, ¡pon a prueba lo aprendido en la pestaña Quiz!</p></div>`);
add(null,()=>`<h2>Nuestro recorrido</h2><p class="sub">Toca una sesión para ir directo, o avanza en orden.</p><div class="grid">${["c1","c2","c3","c4","c5","c7","c8"].map(k=>`<button class="chip" onclick="go(SL.findIndex(x=>x.s=='${k}'))"><span class="e">${SEC[k][0]}</span><b>${SEC[k][1]}</b><span class="lab" style="color:var(--mut)">${SEC[k][2]}</span></button>`).join("")}</div>`);
/* CLASE 1 */
const HW={cpu:["🧠","Procesador (CPU)","Ejecuta las instrucciones y realiza los cálculos de la computadora.","El cerebro: decide y calcula todo lo que la computadora hace.","Su velocidad se mide en GHz y tiene varios núcleos, como varios mini-cerebros trabajando a la vez. Se calienta, por eso lleva ventilador.",1,"La PC no puede procesar nada: no arranca."],
ram:["💭","Memoria RAM","Almacena de forma temporal los procesos en ejecución para que la PC trabaje más rápido. Es memoria volátil.","Una nube pensante: guarda lo que estás pensando ahora mismo, pero solo por un momento. Si apagas la PC, la nube se desvanece. Mientras más grande, más ideas a la vez.","Se mide en GB (4, 8, 16…). Más RAM = más programas abiertos sin que se ponga lenta. Lo que no guardaste se pierde al apagar.",1,"No inicia. Y si se apaga, lo que no guardaste se pierde."],
disk:["💾","ROM / Disco duro","Almacena de forma permanente el sistema operativo, los programas y tus archivos.","El archivador o la biblioteca: guarda todo para siempre, aunque apagues la luz.","Se mide en GB o TB. Hay discos mecánicos (HDD, con partes que giran) y discos sólidos (SSD), mucho más rápidos.",1,"No hay dónde cargar el sistema operativo: no arranca."],
mb:["🧷","Placa madre","Conecta todos los componentes y permite que se comuniquen entre sí; reparte la energía.","La columna vertebral y el sistema nervioso: une todos los órganos y lleva las señales entre ellos. También como las calles de una ciudad.","Tiene ranuras y conectores para la CPU, la RAM, el disco y las tarjetas. Todo se enchufa a ella.",1,"Los componentes quedan aislados: nada funciona."],
psu:["🔌","Fuente de poder","Proporciona la energía eléctrica a los componentes de la PC.","El corazón: manda la energía a todo el cuerpo.","Convierte la corriente del tomacorriente en la energía que usa cada pieza. Se mide en watts (W).",1,"La computadora no enciende ni recibe energía."]};
add("c1",()=>`<h2>Las partes fundamentales</h2><p class="sub">En clase las dibujaron y buscaron más información en internet. Toca cada componente para repasarlo.</p><div class="grid">${Object.entries(HW).map(([k,v])=>`<button class="chip" data-k="${k}" onclick="hw('${k}')"><span class="e">${v[0]}</span><b>${v[1]}</b></button>`).join("")}</div><div class="panel" id="hwp">👆 Elige un componente.</div>`);
window.hw=k=>{const v=HW[k];mark("[data-k]","k",k);$("#hwp").innerHTML=`<h3>${v[0]} ${v[1]} <span class="tag ${v[5]?"":"no"}">${v[5]?"Esencial":"No esencial"}</span></h3><p><b>Función:</b> ${v[2]}</p><p><b>🧩 Analogía:</b> ${v[3]}</p><p><b>📌 Datos clave:</b> ${v[4]}</p><p><b>⚠️ Si falla:</b> ${v[6]}</p>`};
const FL=[["🔌","La fuente de poder da energía a todo el equipo."],["💾","Tu documento está guardado de forma permanente en el disco."],["💭","Al abrirlo, se copia a la RAM: la nube pensante, memoria temporal de trabajo."],["🧠","La CPU procesa las instrucciones del programa."]];
let fs=-1;
add("c1",()=>{fs=-1;return`<h2>¿Cómo trabajan juntos?</h2><p class="sub">Qué pasa por dentro cuando abres un documento. La placa madre conecta todo el camino.</p><div class="row" style="align-items:stretch">${FL.map((f,i)=>`<div class="node" id="n${i}"><div style="font-size:30px">${f[0]}</div><small>Paso ${i+1}</small></div>`).join("")}</div><div class="panel" id="fp">Pulsa el botón para recorrer el camino paso a paso.</div><div class="row"><button class="btn" onclick="fl()">Siguiente paso →</button><button class="btn ghost" onclick="fs=-1;fl(1)">Reiniciar</button></div>`});
window.fl=r=>{fs=r?-1:Math.min(fs+1,FL.length);document.querySelectorAll(".node").forEach((n,i)=>n.classList.toggle("on",i<=fs&&fs<FL.length&&i==fs||(fs>=FL.length)));$("#fp").innerHTML=r?"Pulsa el botón para recorrer el camino paso a paso.":fs<FL.length?`<b>Paso ${fs+1}:</b> ${FL[fs][1]}`:"✅ ¡Listo! Todos trabajaron en equipo, conectados por la placa madre. Si falta uno esencial, la computadora no funciona."};
const MA=["Es el cerebro que calcula y decide","Es la nube pensante: guarda lo temporal y se desvanece al apagar","Es el archivador donde todo se guarda para siempre","Es la columna vertebral que conecta todo","Es el corazón que reparte la energía"],MK=["cpu","ram","disk","mb","psu"];
add("c1",()=>`<h2>¿Quién es quién?</h2><p class="sub">Une cada analogía con su componente.</p>${MA.map((a,i)=>`<div class="row"><select data-m="${i}"><option value="">— elige —</option>${MK.map(k=>`<option value="${k}">${HW[k][1]}</option>`).join("")}</select><span id="mr${i}">${a}</span></div>`).join("")}<div class="row"><button class="btn" onclick="mk()">Comprobar</button><span id="mres"></span></div>`);
window.mk=()=>{let o=0;document.querySelectorAll("[data-m]").forEach(s=>{const i=+s.dataset.m,r=s.value==MK[i];if(r)o++;$("#mr"+i).textContent=(s.value?(r?"✅ ":"❌ "):"")+MA[i]});$("#mres").textContent=o==5?"🎉 ¡Perfecto!":o+" de 5 correctas"};
/* CLASE 2 */
const BP={h:"<b>Encabezado:</b> nombre del negocio y datos en texto centrado, con negrita y un tamaño de letra mayor. También puedes cambiar el color de la letra y del fondo.",c:"<b>Datos del cliente:</b> texto alineado a la izquierda, en líneas cortas.",t:"<b>Detalle de compra:</b> se arma con una tabla (Insertar → Tabla): cantidad, descripción y precio. Para que no se note la tabla, los bordes se ponen en blanco.",s:"<b>Total:</b> alineado a la derecha y en negrita para que destaque."};
add("c2",()=>`<h2>Primer contacto con Google Docs</h2><div class="two"><div><ul><li>Creamos nuestro primer documento y le pusimos nombre.</li><li>Docs se guarda solo, y varias personas pueden editar a la vez.</li><li>Practicamos negrita, tamaños y tablas.</li><li>Aprendimos a cambiar el <b>color de la letra y del fondo</b>, y a poner los <b>bordes en blanco</b> para que parezca que se eliminaron.</li><li><b>Replicamos el formato de una boleta</b>, y la evaluación continua de ese tiempo fue recrear su diseño.</li></ul><p class="sub">Toca las partes de la boleta →</p><div class="panel" id="bpp">¿Qué herramienta usarías en cada parte?</div></div><div><div class="row"><button class="chip" data-s="b" onclick="sty('b')">⬜ Bordes blancos</button><button class="chip" data-s="f" onclick="sty('f')">🎨 Color de fondo</button><button class="chip" data-s="l" onclick="sty('l')">🔤 Color de letra</button></div><div class="doc" style="font-family:Arial,sans-serif;font-size:13px"><div class="bp" id="bh" data-b="h" onclick="bl('h')" style="text-align:center"><b style="font-size:17px">MINIMARKET EL SOL</b><br>RUC 20123456789 · <b>BOLETA DE VENTA</b></div><div class="bp" data-b="c" onclick="bl('c')">Cliente: ____________<br>Fecha: ____ / ____ / ____</div><div class="bp" data-b="t" onclick="bl('t')"><table id="bt"><tr style="background:#e6eefa"><th>Cant.</th><th>Descripción</th><th>Precio</th></tr><tr><td>2</td><td>Arroz 1 kg</td><td>S/ 9.00</td></tr><tr><td>1</td><td>Aceite</td><td>S/ 3.50</td></tr></table></div><div class="bp" data-b="s" onclick="bl('s')" style="text-align:right"><b>TOTAL: S/ 12.50</b></div></div></div></div>`);
window.bl=k=>{mark("[data-b]","b",k);$("#bpp").innerHTML=BP[k]};
window.sty=k=>{const b=document.querySelector('[data-s="'+k+'"]');b.classList.toggle("on");const on=b.classList.contains("on");if(k=="b")$("#bt").classList.toggle("w",on);if(k=="f")$("#bh").style.background=on?"#ffe08a":"";if(k=="l")$("#bh").style.color=on?"#c0392b":""};
/* DOCUMENTOS: indice */
const IL=["Mi presentación","¿Quién soy?","Mis habilidades","Habilidades técnicas","Habilidades personales","Mis metas"];
add("c3",()=>`<h2>Índice, tablas e imágenes</h2><div class="two"><div><ul><li>El índice se genera con <b>Insertar → Tabla de contenido</b>.</li><li>Primero hay que aplicar <b>estilos de encabezado</b>: <b>Encabezado 1</b> para el título principal, y así hasta <b>Encabezado 3</b>. Sin encabezados, el índice sale vacío.</li><li>Si agregas encabezados nuevos, <b>actualiza</b> el índice.</li><li>Las <b>tablas</b> (Insertar → Tabla) ordenan datos en filas y columnas.</li><li>Las <b>imágenes</b> se agregan desde Insertar → Imagen.</li></ul><p class="sub">Prueba: asigna un estilo a cada línea →</p></div><div><div class="doc">${IL.map((t,i)=>`<div class="row" style="margin:3px 0"><select onchange="ix()" data-i="${i}"><option value="0">Texto normal</option><option value="1">Encabezado 1</option><option value="2">Encabezado 2</option><option value="3">Encabezado 3</option></select><span>${t}</span></div>`).join("")}<hr><b>Índice</b><div class="idx" id="ix"></div></div></div></div>`,()=>ix());
window.ix=()=>{const h=[...document.querySelectorAll("select[data-i]")].map((e,i)=>[+e.value,i]).filter(a=>a[0]);$("#ix").innerHTML=h.length?h.map(a=>`<div style="padding-left:${(a[0]-1)*18}px"><span>${IL[a[1]]}</span><span class="d"></span><span>${a[1]+2}</span></div>`).join(""):"<i style='color:#888'>Índice vacío: aplica estilos de encabezado.</i>"};
/* CLASE 4 */
let PM="n";
add("c4",()=>`<h2>Sangrías, interlineado y espaciado</h2><p class="sub">Prueba cada estilo y mueve los deslizadores.</p><div class="row"><button class="chip on" data-m2="n" onclick="pf('n')">Sin formato</button><button class="chip" data-m2="s" onclick="pf('s')">Sangría simple</button><button class="chip" data-m2="f" onclick="pf('f')">Sangría francesa</button></div><div class="row">Entre líneas (interlineado) <input type="range" id="il" min="1" max="2.5" step=".1" value="1.2" oninput="pf()"> <span id="ilv"></span> &nbsp; Entre párrafos <input type="range" id="ep" min="0" max="30" value="8" oninput="pf()"> <span id="epv"></span></div><div class="doc" id="pd" style="font-size:15px"><p>Era obvio que la empatía sólo se encontraba en la comunidad humana, en tanto que se podía hallar cierto grado de inteligencia en todas las especies, hasta en los arácnidos. Probablemente la facultad empática exigía un instinto de grupo sin cortapisas.</p><p>En una ocasión había pensado que la empatía estaba reservada a los herbívoros o a los omnívoros capaces de prescindir de la carne. En última instancia, la empatía borraba las fronteras entre el cazador y la víctima.</p></div><div class="panel" id="pp"></div>`,()=>pf());
window.pf=m=>{if(m)PM=m;mark("[data-m2]","m2",PM);const il=$("#il").value,ep=$("#ep").value;$("#ilv").textContent=il;$("#epv").textContent=ep+" pt";document.querySelectorAll("#pd p").forEach(p=>{p.style.lineHeight=il;p.style.margin="0 0 "+ep+"px";p.style.textIndent=PM=="s"?"1.15cm":PM=="f"?"-1.15cm":"0";p.style.paddingLeft=PM=="f"?"1.15cm":"0"});$("#pp").innerHTML={n:"<b>Sin formato:</b> el texto empieza en el margen izquierdo, sin desplazamiento.",s:"<b>Sangría simple:</b> solo la <u>primera línea</u> se desplaza a la derecha. En Docs: Sangría especial → Primera línea (1.15 cm).",f:"<b>Sangría francesa:</b> la primera línea queda en el margen y las <u>siguientes</u> se desplazan a la derecha. En Docs: Sangría especial → Colgante."}[PM]+"<br><b>Interlineado</b> = espacio entre renglones. <b>Espaciado entre párrafos</b> = Después del párrafo (ej. 10 pt)."};

["ali","¿Qué alineación hace que el texto toque ambos márgenes?","Justificada",["Izquierda","Derecha","Centrada"],"Forma un bloque parejo."],

["cv","Antes de escribir el CV, ¿qué formato se ajusta?","Quitar encabezado, dividir en 2 columnas y poner márgenes en 1",["Insertar índice y numerar páginas","Combinar columnas y poner márgenes en 10","Insertar encabezado y aplicar sangría francesa"],"Así queda la plantilla de dos columnas."],
["cv","¿Qué dato conviene OMITIR en un CV?","Estado civil o DNI",["Formación académica","Experiencia / prácticas","Correo electrónico"],"Son datos personales innecesarios."],
["cv","¿Qué datos de contacto son imprescindibles en el CV?","Celular y correo electrónico",["DNI y estado civil","Edad exacta y religión","Solo la dirección"],"Es lo mínimo para que te contacten."],
["cv","¿Qué parte de la dirección se escribe en el CV?","Solo el distrito y la provincia",["La calle y el número exactos","El piso y una referencia","Ninguna parte"],"No se ponen todos los datos del domicilio."],
["cv","El enlace de LinkedIn en un CV es…","Opcional, pero muy usado actualmente",["Obligatorio","Está prohibido","Solo para médicos"],"Suma, pero no es indispensable."],

["cv","En el CV de la clase, ¿qué va en la columna izquierda?","La foto y la información de contacto",["Formación y experiencia","Solo el perfil","El índice"],"A la derecha va el nombre y el resto de secciones."],
["cv","¿Cuándo usamos columnas por primera vez?","Al crear el CV",["En la clase de la boleta","En la clase de sangrías","En la clase de alineación"],"Dividimos la hoja en 2 columnas."],

["trab","En el trabajo con carátula, las habilidades personales y técnicas se mostraron en…","Dos columnas",["Una tabla de 5 filas","Un índice","Sangría francesa"],"Una muestra de lo aprendido en un documento."],
["trab","¿Qué herramienta genera el índice del trabajo?","Estilos de encabezado + Tabla de contenido",["Negrita + color","Sangría francesa","Interlineado doble"],"Se actualiza cuando agregas títulos."]
];
let QS=null;
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let sel=new Set(Object.keys(T)),nq=10;
function setup(){QS=null;$("#qz").innerHTML=`<h2>🎯 Quiz de repaso</h2><p class="sub">${Q.length} preguntas. Cada intento es distinto: las preguntas y las alternativas se mezclan.</p><h3>Temas</h3><div class="row">${Object.entries(T).map(([k,v])=>`<button class="chip ${sel.has(k)?"on":""}" onclick="tg('${k}')">${v}</button>`).join("")}</div><h3>Cantidad</h3><div class="row">${[10,20,0].map(n=>`<button class="chip ${nq==n?"on":""}" onclick="nq=${n};setup()">${n||"Todas"}</button>`).join("")}</div><p class="sub">${Q.filter(q=>sel.has(q[0])).length} preguntas disponibles con tu selección.</p><button class="btn" onclick="start()">Comenzar</button>`}
window.tg=k=>{sel.has(k)?sel.delete(k):sel.add(k);if(!sel.size)sel.add(k);setup()};
window.rq=()=>{sel=new Set(Object.keys(T));nq=10;setup()};
window.start=()=>{let p=sh(Q.filter(q=>sel.has(q[0])));if(nq)p=p.slice(0,nq);QS={p,i:0,ok:0,bad:[]};ask()};
function ask(){const q=QS.p[QS.i];QS.o=sh([q[2],...q[3]]);QS.a=false;$("#qz").innerHTML=`<div class="row"><div class="bar"><i style="width:${QS.i/QS.p.length*100}%"></i></div><span class="cnt">${QS.i+1}/${QS.p.length}</span></div><span class="tag">${T[q[0]]}</span><h2 style="color:var(--ink);margin-top:10px">${q[1]}</h2>${QS.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${"ABCD"[i]}) ${o}</button>`).join("")}<div id="fb"></div>`}
window.pick=i=>{if(QS.a)return;QS.a=true;const q=QS.p[QS.i],r=QS.o[i]==q[2];document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(QS.o[j]==q[2])b.classList.add("ok");else if(j==i)b.classList.add("bad")});if(r)QS.ok++;else QS.bad.push(q);const last=QS.i==QS.p.length-1;$("#fb").innerHTML=`<div class="exp">${r?"✅ <b>¡Correcto!</b>":"❌ <b>Respuesta correcta:</b> "+q[2]}<br>${q[4]}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="${last?"fin()":"QS.i++;ask()"}">${last?"Ver resultado":"Siguiente →"}</button></div>`};
window.fin=()=>{const n=QS.p.length,p=Math.round(QS.ok/n*100);$("#qz").innerHTML=`<div style="text-align:center"><div class="big">${QS.ok}/${n}</div><h2>${p>=85?"🏆 ¡Excelente!":p>=60?"👍 Buen avance":"💪 Sigue repasando"}</h2></div>${QS.bad.length?`<h3>Para repasar</h3>${QS.bad.map(q=>`<div class="exp"><b>${q[1]}</b><br>✔ ${q[2]}</div>`).join("<div style='height:8px'></div>")}`:"<p class='sub' style='text-align:center'>¡Sin errores!</p>"}<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="start()">Repetir (mezcla nueva)</button><button class="btn ghost" onclick="setup()">Cambiar temas</button><button class="btn ghost" onclick="tab(1)">Volver a la clase</button></div>`};
show();
</script>
